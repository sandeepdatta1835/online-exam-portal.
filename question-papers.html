<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Online Exam - Question Papers</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#1d4ed8;
    color:white;
    padding:20px;
}

.container{
    width:94%;
    max-width:1000px;
    margin:20px auto;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
    background:#1d4ed8;
    color:white;
    border:0;
    padding:11px 17px;
    border-radius:6px;
    cursor:pointer;
}

.paper{
    border:1px solid #ddd;
    padding:16px;
    margin:12px 0;
    border-radius:8px;
}

.student{
    color:#1d4ed8;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<div class="container">
<h1>Online Exam</h1>
<p>Question Papers</p>
</div>
</header>

<div class="container">

<div class="card">

<p>
Student ID:
<span class="student"
      id="studentId"></span>
</p>

<button onclick="
location.href='student-dashboard.html'
">
Back to Dashboard
</button>

</div>


<div class="card">

<h2>Published Question Papers</h2>

<div id="paperList">
Loading...
</div>

</div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


const studentId =
    localStorage.getItem("studentId");


if(!studentId){

    location.href =
        "login.html";
}


document.getElementById(
    "studentId"
).textContent =
    studentId;


function api(action,params={}){

    return new Promise(function(resolve,reject){

        const callback =
            "cb_" +
            Date.now() +
            Math.floor(Math.random()*10000);

        const script =
            document.createElement("script");

        const query =
            new URLSearchParams();

        query.append("action",action);
        query.append("callback",callback);

        Object.keys(params).forEach(function(key){

            query.append(
                key,
                params[key]
            );

        });

        window[callback] =
            function(data){

                delete window[callback];

                script.remove();

                resolve(data);
            };

        script.onerror =
            function(){

                delete window[callback];

                script.remove();

                reject(
                    new Error("API connection failed")
                );
            };

        script.src =
            API + "?" + query.toString();

        document.body.appendChild(script);
    });
}


async function loadPapers(){

    const box =
        document.getElementById(
            "paperList"
        );

    try{

        const result =
            await api(
                "getPublishedQuestionPapers",
                {
                    studentId:
                        studentId
                }
            );

        if(!result.success){

            box.innerHTML =
                "<p>" +
                escapeHtml(result.message) +
                "</p>";

            return;
        }

        const papers =
            result.data || [];

        if(papers.length === 0){

            box.innerHTML =
                "<p>No published question papers are available for your Student ID.</p>";

            return;
        }

        box.innerHTML = "";

        papers.forEach(function(paper){

            const div =
                document.createElement("div");

            div.className =
                "paper";

            div.innerHTML = `
                <h3>
                    ${escapeHtml(paper.paperName)}
                </h3>

                <p>
                    <strong>Student ID:</strong>
                    ${escapeHtml(paper.studentId)}
                </p>

                <p>
                    <strong>Subject:</strong>
                    ${escapeHtml(paper.subjectCode)}
                    -
                    ${escapeHtml(paper.subjectName)}
                </p>

                <p>
                    <strong>Board:</strong>
                    ${escapeHtml(paper.board)}
                </p>

                <p>
                    <strong>Class:</strong>
                    ${escapeHtml(paper.studentClass)}
                </p>

                <p>
                    <strong>Exam Type:</strong>
                    ${escapeHtml(paper.examType)}
                </p>

                <p>
                    <strong>Year:</strong>
                    ${escapeHtml(paper.year)}
                </p>

                ${
                    paper.fileUrl
                    ?
                    `<p>
                        <a href="${escapeHtml(paper.fileUrl)}"
                           target="_blank">
                           Open Question Paper
                        </a>
                    </p>`
                    :
                    "<p>Question paper file not available.</p>"
                }

                <button onclick="
                    location.href =
                    'submit-answer.html?questionPaperId=${encodeURIComponent(paper.questionPaperId)}&subjectId=${encodeURIComponent(paper.subjectId)}'
                ">
                    Submit Answer
                </button>
            `;

            box.appendChild(div);

        });

    }catch(error){

        box.innerHTML =
            "<p>" +
            escapeHtml(error.message) +
            "</p>";
    }
}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


loadPapers();

</script>

</body>
</html>
