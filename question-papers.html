<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Exam - Question Papers</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
}
header{
    background:#1f2937;
    color:white;
    padding:18px;
}
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}
.card{
    background:white;
    padding:18px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
button{
    border:0;
    padding:12px 16px;
    border-radius:7px;
    cursor:pointer;
    margin-top:8px;
}
.primary{
    background:#2563eb;
    color:white;
}
.success{
    background:#16a34a;
    color:white;
}
.warning{
    background:#f59e0b;
    color:white;
}
.logout{
    background:#dc2626;
    color:white;
}
</style>
</head>

<body>

<header>
    <h2>Online Exam</h2>
    <div>Question Papers</div>
</header>

<div class="container">

    <div class="card">
        <b>Student ID:</b>
        <span id="studentId"></span>
    </div>

    <div id="message"></div>

    <div id="papers"></div>

    <button class="logout" onclick="logout()">Logout</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";

const studentId =
localStorage.getItem("studentId");

document.getElementById("studentId").textContent =
studentId || "Not logged in";

if(!studentId){
    window.location.href="login.html";
}

function api(action, params={}){
    return new Promise((resolve,reject)=>{

        const callback =
            "cb_" + Date.now() + "_" +
            Math.floor(Math.random()*10000);

        const script =
            document.createElement("script");

        window[callback] = function(data){

            delete window[callback];

            script.remove();

            if(data.success){
                resolve(data);
            }else{
                reject(
                    new Error(data.message || "Error")
                );
            }
        };

        params.action = action;
        params.studentId = studentId;
        params.callback = callback;

        const query =
            Object.keys(params)
            .map(k =>
                encodeURIComponent(k) +
                "=" +
                encodeURIComponent(params[k])
            )
            .join("&");

        script.src =
            API + "?" + query;

        script.onerror = () => {
            reject(new Error("API connection failed."));
        };

        document.body.appendChild(script);
    });
}

async function loadPapers(){

    const box =
        document.getElementById("papers");

    box.innerHTML =
        "<div class='card'>Loading...</div>";

    try{

        const data =
            await api(
                "getPublishedQuestionPapers"
            );

        if(!data.papers.length){

            box.innerHTML =
                "<div class='card'>No published question papers are available for your assigned subjects.</div>";

            return;
        }

        box.innerHTML =
            data.papers.map(p => `

                <div class="card">

                    <h3>${escapeHtml(p.paperName)}</h3>

                    <p>
                        <b>Subject:</b>
                        ${escapeHtml(p.subjectCode)}
                        -
                        ${escapeHtml(p.subjectName)}
                    </p>

                    <p>
                        <b>Board:</b>
                        ${escapeHtml(p.board)}
                    </p>

                    <p>
                        <b>Class:</b>
                        ${escapeHtml(p.className)}
                    </p>

                    <p>
                        <b>Exam Type:</b>
                        ${escapeHtml(p.examType)}
                    </p>

                    <p>
                        <b>Status:</b>
                        Published
                    </p>

                    <button
                        class="primary"
                        onclick="openPaper('${escapeJs(p.questionPaperId)}')">
                        Download Question Paper
                    </button>

                </div>

            `).join("");

    }catch(err){

        box.innerHTML =
            "<div class='card'>" +
            escapeHtml(err.message) +
            "</div>";
    }
}


function openPaper(questionPaperId){

    window.location.href =
        "live-photo.html?questionPaperId=" +
        encodeURIComponent(questionPaperId);
}


function logout(){

    localStorage.removeItem("studentId");
    localStorage.removeItem("studentName");

    window.location.href =
        "login.html";
}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeJs(value){

    return String(value || "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


loadPapers();

</script>

</body>
</html>
