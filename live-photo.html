<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Live Photo Verification</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

.header{
    background:#17365d;
    color:white;
    padding:18px;
}

.header h1{
    margin:0;
    font-size:22px;
}

.container{
    max-width:700px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.camera-box{
    width:100%;
    max-width:600px;
    margin:auto;
    background:#000;
    border-radius:10px;
    overflow:hidden;
}

video{
    width:100%;
    display:block;
}

canvas{
    display:none;
}

.preview{
    width:100%;
    display:none;
    border-radius:10px;
}

button{
    border:0;
    padding:12px 18px;
    border-radius:7px;
    color:white;
    cursor:pointer;
    margin:5px;
}

.blue{
    background:#1565c0;
}

.green{
    background:#198754;
}

.orange{
    background:#ef6c00;
}

.gray{
    background:#777;
}

.red{
    background:#c62828;
}

button:disabled{
    background:#aaa;
    cursor:not-allowed;
}

.message{
    padding:12px;
    border-radius:7px;
    margin:12px 0;
}

.info{
    background:#e3f2fd;
    color:#0d47a1;
}

.success{
    background:#e8f5e9;
    color:#1b5e20;
}

.error{
    background:#ffebee;
    color:#b71c1c;
}

.warning{
    background:#fff3cd;
    color:#664d03;
}

.center{
    text-align:center;
}

</style>

</head>


<body>


<div class="header">

    <h1>
        📸 Live Photo Verification
    </h1>

</div>


<div class="container">

<div class="card">


<div id="message"
     class="message info">

    Please allow camera access and
    capture your live photo.

</div>


<div class="camera-box">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

</div>


<canvas id="canvas"></canvas>


<img
    id="preview"
    class="preview"
    alt="Live Photo Preview">


<div class="center">


<button
    id="startButton"
    class="blue"
    onclick="startCamera()">

    📷 Start Camera

</button>


<button
    id="captureButton"
    class="green"
    onclick="capturePhoto()"
    disabled>

    📸 Capture Live Photo

</button>


<button
    id="retakeButton"
    class="orange"
    onclick="retakePhoto()"
    style="display:none;">

    🔄 Retake

</button>


<button
    id="continueButton"
    class="green"
    onclick="continueVerification()"
    style="display:none;">

    ✅ Continue

</button>


<button
    class="gray"
    onclick="goBack()">

    ← Back

</button>


</div>


<div
    id="status"
    class="center">
</div>


</div>

</div>


<script>


/* =====================================================
   URL PARAMETERS
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const questionPaperId =
    params.get(
        "questionPaperId"
    );


const type =
    params.get(
        "type"
    ) ||
    "submission";


/* =====================================================
   STUDENT
===================================================== */

function getStudentId(){

    const keys = [
        "studentId",
        "StudentID",
        "studentID",
        "loggedInStudentId",
        "loggedInStudentID",
        "currentStudentId"
    ];


    for(
        let i=0;
        i<keys.length;
        i++
    ){

        const value =
            localStorage.getItem(
                keys[i]
            );


        if(
            value &&
            value.trim()
        ){

            return value.trim();

        }

    }


    return "";

}


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "video"
    );


const canvas =
    document.getElementById(
        "canvas"
    );


const preview =
    document.getElementById(
        "preview"
    );


const message =
    document.getElementById(
        "message"
    );


const statusBox =
    document.getElementById(
        "status"
    );


const startButton =
    document.getElementById(
        "startButton"
    );


const captureButton =
    document.getElementById(
        "captureButton"
    );


const retakeButton =
    document.getElementById(
        "retakeButton"
    );


const continueButton =
    document.getElementById(
        "continueButton"
    );


let stream = null;

let capturedPhoto = null;


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    try{

        if(stream){

            stopCamera();

        }


        message.className =
            "message info";


        message.innerText =
            "Starting camera...";


        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{
                        facingMode:
                            "user",

                        width:{
                            ideal:720
                        },

                        height:{
                            ideal:720
                        }
                    },

                    audio:false

                });


        video.srcObject =
            stream;


        await video.play();


        captureButton.disabled =
            false;


        startButton.disabled =
            true;


        message.className =
            "message success";


        message.innerText =
            "Camera started. Please capture your live photo.";


    }catch(error){

        message.className =
            "message error";


        message.innerHTML =

            "❌ Camera could not be started." +
            "<br><br>" +
            "Please allow camera permission and try again." +
            "<br><br>" +
            error.message;

    }

}


/* =====================================================
   CAPTURE PHOTO
===================================================== */

function capturePhoto(){

    if(
        !stream
    ){

        alert(
            "Please start the camera first."
        );

        return;

    }


    if(
        video.readyState <
        2
    ){

        alert(
            "Camera is not ready yet."
        );

        return;

    }


    let width =
        video.videoWidth;


    let height =
        video.videoHeight;


    const maxWidth =
        650;


    if(
        width >
        maxWidth
    ){

        height =
            height *
            (
                maxWidth /
                width
            );

        width =
            maxWidth;

    }


    canvas.width =
        width;


    canvas.height =
        height;


    const context =
        canvas.getContext(
            "2d"
        );


    context.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    capturedPhoto =
        canvas.toDataURL(
            "image/jpeg",
            0.65
        );


    preview.src =
        capturedPhoto;


    preview.style.display =
        "block";


    stopCamera();


    captureButton.style.display =
        "none";


    startButton.style.display =
        "none";


    retakeButton.style.display =
        "inline-block";


    continueButton.style.display =
        "inline-block";


    message.className =
        "message success";


    message.innerText =
        "✅ Live photo captured. Please click Continue.";

}


/* =====================================================
   RETAKE
===================================================== */

function retakePhoto(){

    capturedPhoto =
        null;


    preview.src =
        "";


    preview.style.display =
        "none";


    retakeButton.style.display =
        "none";


    continueButton.style.display =
        "none";


    startButton.style.display =
        "inline-block";


    startButton.disabled =
        false;


    captureButton.style.display =
        "inline-block";


    captureButton.disabled =
        true;


    statusBox.innerText =
        "";


    message.className =
        "message info";


    message.innerText =
        "Please start the camera again.";

}


/* =====================================================
   CONTINUE VERIFICATION
===================================================== */

function continueVerification(){

    if(
        !capturedPhoto
    ){

        alert(
            "Please capture your live photo first."
        );

        return;

    }


    const studentId =
        getStudentId();


    if(!studentId){

        alert(
            "Student login session not found."
        );

        window.location.href =
            "login.html";

        return;

    }


    if(!questionPaperId){

        alert(
            "Question Paper ID is missing."
        );

        return;

    }


    /*
       IMPORTANT:
       Save verification BEFORE redirect.
    */

    const verificationKey =
        "livePhotoVerified_" +
        type +
        "_" +
        studentId +
        "_" +
        questionPaperId;


    const capturedKey =
        type === "submission"

        ?

        "submissionLivePhotoCaptured_" +
        studentId +
        "_" +
        questionPaperId

        :

        "downloadLivePhotoCaptured_" +
        studentId +
        "_" +
        questionPaperId;


    const imageKey =
        "livePhotoImage_" +
        type +
        "_" +
        studentId +
        "_" +
        questionPaperId;


    try{

        localStorage.setItem(
            verificationKey,
            "yes"
        );


        localStorage.setItem(
            capturedKey,
            "yes"
        );


        localStorage.setItem(
            imageKey,
            capturedPhoto
        );


        /*
           Keep compatibility with
           existing submission page.
        */

        if(
            type === "submission"
        ){

            localStorage.setItem(
                "submissionLivePhotoLocal",
                capturedPhoto
            );

        }


        /*
           Verify that localStorage really contains
           the verification before redirecting.
        */

        const check =
            localStorage.getItem(
                verificationKey
            );


        if(
            check !== "yes"
        ){

            throw new Error(
                "Live photo verification could not be saved."
            );

        }


        message.className =
            "message success";


        message.innerText =
            "✅ Verification saved. Returning to submission page...";


        continueButton.disabled =
            true;


        setTimeout(
            function(){

                if(
                    type ===
                    "submission"
                ){

                    window.location.replace(
                        "submit-answer.html" +
                        "?questionPaperId=" +
                        encodeURIComponent(
                            questionPaperId
                        ) +
                        "&verified=1"
                    );

                }else{

                    window.location.replace(
                        "question-papers.html" +
                        "?verified=1"
                    );

                }

            },
            500
        );


    }catch(error){

        message.className =
            "message error";


        message.innerText =
            "❌ " +
            error.message;

    }

}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    if(stream){

        stream.getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


        stream = null;

    }


    video.srcObject =
        null;


    captureButton.disabled =
        true;

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    stopCamera();


    if(
        type === "submission"
    ){

        window.location.href =
            "submit-answer.html?questionPaperId=" +
            encodeURIComponent(
                questionPaperId
            );

    }else{

        window.location.href =
            "question-papers.html";

    }

}


/* =====================================================
   PAGE EXIT
===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        stopCamera();

    }
);


/* =====================================================
   AUTO START CAMERA
===================================================== */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        /*
           Start automatically where browser permission
           allows it. If not, user can press Start Camera.
        */

        if(
            navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia
        ){

            startCamera();

        }else{

            message.className =
                "message error";


            message.innerText =
                "Camera is not supported by this browser.";

        }

    }
);

</script>

</body>

</html>
