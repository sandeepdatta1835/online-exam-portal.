<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Photo Verification</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #1f4e79;
    }

    .verification {
      text-align: center;
      margin-bottom: 20px;
    }

    .student-id,
    .paper-id {
      font-weight: bold;
      color: #333;
      margin: 7px 0;
    }

    .instruction {
      background: #eef5ff;
      border-left: 5px solid #1f73b7;
      padding: 12px;
      margin: 15px 0;
      line-height: 1.5;
    }

    video,
    canvas,
    #preview {
      width: 100%;
      max-width: 500px;
      display: block;
      margin: 15px auto;
      border-radius: 10px;
      background: #111;
    }

    #preview {
      display: none;
    }

    canvas {
      display: none;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    button {
      border: none;
      padding: 13px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .camera {
      background: #1976d2;
      color: white;
    }

    .capture {
      background: #2e7d32;
      color: white;
    }

    .retake {
      background: #f57c00;
      color: white;
    }

    .download {
      background: #6a1b9a;
      color: white;
    }

    .back {
      background: #555;
      color: white;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .success {
      background: #dff5e1;
      color: #176b24;
    }

    .error {
      background: #ffe0e0;
      color: #a00000;
    }

    .info {
      background: #e5f0ff;
      color: #174a8b;
    }

    #downloadSection {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Live Photo Verification</h1>

    <div class="verification">

      <h3>Student Verification</h3>

      <div class="student-id">
        Student ID:
        <span id="studentId">Loading...</span>
      </div>

      <div class="paper-id">
        Question Paper ID:
        <span id="questionPaperId">Loading...</span>
      </div>

    </div>

    <div class="instruction">
      Please take a live photo before downloading the question paper.
      The photo is used to record your verification for this question paper.
    </div>

    <video id="video" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

    <img id="preview" alt="Live Photo Preview">

    <div class="buttons">

      <button
        id="startCameraBtn"
        class="camera"
        onclick="startCamera()">
        📷 Start Camera
      </button>

      <button
        id="captureBtn"
        class="capture"
        onclick="capturePhoto()"
        disabled>
        📸 Take Live Photo
      </button>

      <button
        id="retakeBtn"
        class="retake"
        onclick="retakePhoto()"
        style="display:none;">
        🔄 Retake Photo
      </button>

    </div>

    <div id="status"></div>

    <div id="downloadSection">

      <p>
        <strong>✅ Live photo verification completed.</strong>
      </p>

      <button
        class="download"
        onclick="downloadQuestionPaper()">
        📄 Download Question Paper
      </button>

    </div>

    <div class="buttons">

      <button
        class="back"
        onclick="goBack()">
        ← Back to Question Papers
      </button>

    </div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


const params = new URLSearchParams(window.location.search);

const studentId =
  localStorage.getItem("studentId") ||
  localStorage.getItem("studentID") ||
  params.get("studentId") ||
  "";

const questionPaperId =
  params.get("questionPaperId") ||
  params.get("paperId") ||
  "";


document.getElementById("studentId").textContent =
  studentId || "Not Found";

document.getElementById("questionPaperId").textContent =
  questionPaperId || "Not Found";


let stream = null;
let capturedImage = "";
let uploadedLivePhotoUrl = "";


/* ------------------------------
   STATUS
------------------------------ */

function showStatus(message, type) {

  const box = document.getElementById("status");

  box.textContent = message;

  box.className = "";

  box.classList.add(type);

  box.style.display = "block";
}


/* ------------------------------
   START CAMERA
------------------------------ */

async function startCamera() {

  if (!studentId || !questionPaperId) {

    showStatus(
      "Student ID or Question Paper ID is missing.",
      "error"
    );

    return;
  }

  try {

    showStatus(
      "Starting camera...",
      "info"
    );

    stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: {
            ideal: 720
          },
          height: {
            ideal: 720
          }
        },
        audio: false
      });

    const video =
      document.getElementById("video");

    video.srcObject = stream;

    document.getElementById("captureBtn").disabled = false;

    document.getElementById("startCameraBtn").style.display = "none";

    showStatus(
      "Camera started. Please look at the camera and take your live photo.",
      "info"
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "Camera could not be started. Please allow camera permission and try again.",
      "error"
    );
  }
}


/* ------------------------------
   CAPTURE PHOTO
------------------------------ */

async function capturePhoto() {

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  if (!video.videoWidth) {

    showStatus(
      "Camera is not ready yet.",
      "error"
    );

    return;
  }

  /*
    Keep image small so Google Apps Script
    can receive it reliably.
  */

  const maxWidth = 700;

  let width = video.videoWidth;
  let height = video.videoHeight;

  if (width > maxWidth) {

    const ratio = maxWidth / width;

    width = maxWidth;
    height = Math.round(height * ratio);
  }

  canvas.width = width;
  canvas.height = height;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  /*
    JPEG quality 0.65 keeps the request small.
  */

  capturedImage =
    canvas.toDataURL(
      "image/jpeg",
      0.65
    );

  document.getElementById("preview").src =
    capturedImage;

  document.getElementById("preview").style.display =
    "block";

  video.style.display = "none";

  document.getElementById("captureBtn").style.display =
    "none";

  document.getElementById("retakeBtn").style.display =
    "inline-block";

  showStatus(
    "Photo captured. Uploading verification...",
    "info"
  );

  await uploadLivePhoto();
}


/* ------------------------------
   UPLOAD LIVE PHOTO
------------------------------ */

async function uploadLivePhoto() {

  if (!studentId ||
      !questionPaperId ||
      !capturedImage) {

    showStatus(
      "Student ID, Question Paper ID and photo are required.",
      "error"
    );

    return;
  }

  try {

    /*
      IMPORTANT:
      Send as URL encoded form data,
      not JSON.

      This works more reliably with
      Google Apps Script Web Apps.
    */

    const formData = new URLSearchParams();

    formData.append(
      "action",
      "uploadLivePhoto"
    );

    formData.append(
      "studentId",
      studentId
    );

    formData.append(
      "questionPaperId",
      questionPaperId
    );

    formData.append(
      "image",
      capturedImage
    );


    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "application/x-www-form-urlencoded;charset=UTF-8"
        },

        body: formData.toString()

      });


    const text =
      await response.text();

    console.log(
      "UPLOAD RESPONSE:",
      text
    );


    let result;

    try {

      result =
        JSON.parse(text);

    } catch (e) {

      throw new Error(
        "Google Apps Script returned an invalid response."
      );
    }


    if (!result.success) {

      throw new Error(
        result.message ||
        "Live photo upload failed."
      );
    }


    uploadedLivePhotoUrl =
      result.url ||
      result.fileUrl ||
      result.livePhotoUrl ||
      result.fileURL ||
      "";


    /*
      Save verification locally.
    */

    const verificationData = {

      verified: true,

      studentId:
        studentId,

      questionPaperId:
        questionPaperId,

      livePhotoUrl:
        uploadedLivePhotoUrl,

      verifiedAt:
        new Date().toISOString()

    };


    localStorage.setItem(

      "livePhoto_" +
      studentId +
      "_" +
      questionPaperId,

      JSON.stringify(
        verificationData
      )

    );


    localStorage.setItem(

      "livePhotoUrl_" +
      studentId +
      "_" +
      questionPaperId,

      uploadedLivePhotoUrl

    );


    /*
      Stop camera.
    */

    stopCamera();


    document.getElementById("downloadSection").style.display =
      "block";


    showStatus(
      "✅ Live photo verification completed successfully.",
      "success"
    );


  } catch (error) {

    console.error(
      "LIVE PHOTO ERROR:",
      error
    );


    showStatus(
      "Live photo verification failed: " +
      error.message,
      "error"
    );


    /*
      Allow the student to try again.
    */

    document.getElementById("retakeBtn").style.display =
      "inline-block";
  }
}


/* ------------------------------
   RETAKE
------------------------------ */

function retakePhoto() {

  capturedImage = "";

  uploadedLivePhotoUrl = "";

  document.getElementById("preview").style.display =
    "none";

  document.getElementById("retakeBtn").style.display =
    "none";

  document.getElementById("captureBtn").style.display =
    "inline-block";

  document.getElementById("captureBtn").disabled =
    false;

  startCamera();
}


/* ------------------------------
   STOP CAMERA
------------------------------ */

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(
      track => track.stop()
    );

    stream = null;
  }
}


/* ------------------------------
   DOWNLOAD PAPER
------------------------------ */

async function downloadQuestionPaper() {

  const verificationKey =
    "livePhoto_" +
    studentId +
    "_" +
    questionPaperId;


  const verification =
    localStorage.getItem(
      verificationKey
    );


  if (!verification) {

    showStatus(
      "Please complete live photo verification first.",
      "error"
    );

    return;
  }


  let verificationData;

  try {

    verificationData =
      JSON.parse(verification);

  } catch (e) {

    showStatus(
      "Verification data is invalid. Please retake the photo.",
      "error"
    );

    return;
  }


  if (!verificationData.verified) {

    showStatus(
      "Please complete live photo verification first.",
      "error"
    );

    return;
  }


  try {

    showStatus(
      "Loading question paper...",
      "info"
    );


    const url =
      API_URL +
      "?action=getQuestionPapers";


    const response =
      await fetch(url);


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message ||
        "Unable to load question papers."
      );
    }


    const papers =
      result.papers ||
      result.data ||
      result.rows ||
      [];


    const paper =
      papers.find(
        p =>
          String(
            p.QuestionPaperID ||
            p.questionPaperId ||
            p.id ||
            ""
          ) ===
          String(questionPaperId)
      );


    if (!paper) {

      throw new Error(
        "Question paper not found."
      );
    }


    const fileUrl =
      paper.FileURL ||
      paper.fileURL ||
      paper.fileUrl ||
      paper.FileUrl ||
      "";


    if (!fileUrl) {

      throw new Error(
        "Question paper file URL is missing."
      );
    }


    localStorage.setItem(

      "activeLivePhotoUrl",

      verificationData.livePhotoUrl || ""

    );


    /*
      Open question paper.
    */

    window.open(
      fileUrl,
      "_blank"
    );


    showStatus(
      "Question paper opened successfully.",
      "success"
    );


  } catch (error) {

    console.error(error);

    showStatus(
      error.message,
      "error"
    );
  }
}


/* ------------------------------
   BACK
------------------------------ */

function goBack() {

  stopCamera();

  window.location.href =
    "question-papers.html";
}


/* ------------------------------
   CLEANUP
------------------------------ */

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);

</script>

</body>
</html>
