<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Photo Verification</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

.container {
  max-width: 700px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 25px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.10);
  text-align: center;
}

h1 {
  margin-top: 0;
  color: #1f4e79;
}

video,
canvas,
#preview {
  width: 100%;
  max-width: 500px;
  border-radius: 12px;
  margin: 15px auto;
  display: block;
  background: #111;
}

#preview {
  display: none;
}

button {
  border: none;
  padding: 13px 20px;
  margin: 7px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.primary {
  background: #1f4e79;
  color: white;
}

.success {
  background: #198754;
  color: white;
}

.secondary {
  background: #6c757d;
  color: white;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  background: #eef4ff;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>Live Photo Verification</h1>

    <p>Please take a new live photo to continue.</p>

    <video id="camera" autoplay playsinline></video>

    <canvas id="canvas" class="hidden"></canvas>

    <img id="preview" alt="Live Photo Preview">

    <div>
      <button id="startCameraBtn" class="primary" onclick="startCamera()">
        Start Camera
      </button>

      <button id="captureBtn" class="success" onclick="capturePhoto()" disabled>
        Take Live Photo
      </button>

      <button id="continueBtn" class="primary" onclick="continueProcess()" disabled>
        Continue
      </button>

      <button class="secondary" onclick="goBack()">
        ← Back
      </button>
    </div>

    <div id="message" class="message">
      Camera is ready to start.
    </div>

  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";

const params = new URLSearchParams(window.location.search);

const questionPaperId = params.get("questionPaperId") || "";

const type = params.get("type") || "download";

const camera = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");

const startCameraBtn =
document.getElementById("startCameraBtn");

const captureBtn =
document.getElementById("captureBtn");

const continueBtn =
document.getElementById("continueBtn");

const message =
document.getElementById("message");

let stream = null;
let capturedPhoto = "";


/* ================================
   MESSAGE
================================ */

function showMessage(text) {
  message.textContent = text;
}


/* ================================
   START CAMERA
================================ */

async function startCamera() {

  try {

    if (stream) {
      stopCamera();
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 650 },
        height: { ideal: 650 }
      },
      audio: false
    });

    camera.srcObject = stream;

    captureBtn.disabled = false;

    startCameraBtn.disabled = true;

    showMessage("Camera started. Please take your live photo.");

  } catch (error) {

    console.error(error);

    showMessage(
      "Camera could not be started. Please allow camera permission and try again."
    );

  }
}


/* ================================
   CAPTURE PHOTO
================================ */

function capturePhoto() {

  if (!stream) {
    showMessage("Please start the camera first.");
    return;
  }

  const videoWidth = camera.videoWidth;
  const videoHeight = camera.videoHeight;

  if (!videoWidth || !videoHeight) {
    showMessage("Camera is not ready. Please wait a moment.");
    return;
  }

  let width = videoWidth;
  let height = videoHeight;

  const maxWidth = 650;

  if (width > maxWidth) {

    height = Math.round(height * maxWidth / width);

    width = maxWidth;

  }

  canvas.width = width;
  canvas.height = height;

  const context = canvas.getContext("2d");

  context.drawImage(
    camera,
    0,
    0,
    width,
    height
  );

  capturedPhoto = canvas.toDataURL(
    "image/jpeg",
    0.60
  );

  preview.src = capturedPhoto;

  preview.style.display = "block";

  camera.style.display = "none";

  continueBtn.disabled = false;

  captureBtn.disabled = true;

  stopCamera();

  showMessage(
    "Live photo captured. Click Continue to verify the photo."
  );
}


/* ================================
   CONTINUE
================================ */

function continueProcess() {

  if (!capturedPhoto) {

    showMessage("Please take a live photo first.");

    return;
  }

  const studentId =
    localStorage.getItem("studentId") || "";

  if (!studentId) {

    showMessage(
      "Student login information was not found. Please login again."
    );

    return;
  }


  /* ================================
     SUBMISSION MODE
  ================================ */

  if (type === "submission") {

    const key =
      "submissionLivePhotoCaptured_" +
      studentId +
      "_" +
      questionPaperId;

    localStorage.setItem(key, "yes");

    localStorage.setItem(
      "submissionLivePhotoLocal",
      capturedPhoto
    );

    showMessage(
      "Live photo verified successfully."
    );

    setTimeout(function() {

      if (window.opener) {

        window.close();

      } else {

        window.location.href =
          "submit-answer.html?questionPaperId=" +
          encodeURIComponent(questionPaperId);

      }

    }, 700);

    return;
  }


  /* ================================
     DOWNLOAD MODE
  ================================ */

  const key =
    "downloadLivePhotoCaptured_" +
    studentId +
    "_" +
    questionPaperId;

  localStorage.setItem(key, "yes");

  localStorage.setItem(
    "downloadLivePhotoLocal",
    capturedPhoto
  );

  showMessage(
    "Live photo verified successfully."
  );

  setTimeout(function() {

    openQuestionPaper();

  }, 500);
}


/* ================================
   OPEN QUESTION PAPER
================================ */

async function openQuestionPaper() {

  try {

    if (!questionPaperId) {

      showMessage(
        "Question paper ID is missing."
      );

      return;
    }

    const response = await fetch(
      API_URL +
      "?action=getQuestionPapers"
    );

    const data = await response.json();

    if (!data.success) {

      showMessage(
        data.message ||
        "Unable to load question paper."
      );

      return;
    }

    const papers =
      data.questionPapers ||
      data.papers ||
      [];

    const paper =
      papers.find(function(item) {

        return String(
          item.QuestionPaperID ||
          item.questionPaperId ||
          item.id ||
          ""
        ) === String(questionPaperId);

      });

    if (!paper) {

      showMessage(
        "Question paper was not found."
      );

      return;
    }

    const fileURL =
      paper.FileURL ||
      paper.fileURL ||
      paper.FileUrl ||
      "";

    if (!fileURL) {

      showMessage(
        "Question paper file is not available."
      );

      return;
    }

    window.location.href = fileURL;

  } catch (error) {

    console.error(error);

    showMessage(
      "Unable to open question paper. Please try again."
    );
  }
}


/* ================================
   STOP CAMERA
================================ */

function stopCamera() {

  if (stream) {

    stream.getTracks().forEach(function(track) {

      track.stop();

    });

    stream = null;
  }

  camera.srcObject = null;
}


/* ================================
   BACK
================================ */

function goBack() {

  stopCamera();

  if (window.opener) {

    window.close();

  } else {

    history.back();

  }
}


/* ================================
   PAGE CLOSE / HIDE
================================ */

window.addEventListener(
  "pagehide",
  function() {

    stopCamera();

  }
);

document.addEventListener(
  "visibilitychange",
  function() {

    if (document.hidden) {

      stopCamera();

    }

  }
);

</script>

</body>
</html>
