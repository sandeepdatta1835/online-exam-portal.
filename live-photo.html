<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Photo Verification</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #222;
}

.container {
  max-width: 600px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  background: #ffffff;
  padding: 22px;
  border-radius: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.12);
}

h1 {
  text-align: center;
  color: #1f4e79;
  margin-top: 0;
}

h2 {
  text-align: center;
  font-size: 20px;
}

.info {
  text-align: center;
  line-height: 1.8;
  margin-bottom: 15px;
}

.info strong {
  color: #333;
}

.instruction {
  background: #eef5ff;
  border-left: 5px solid #1976d2;
  padding: 13px;
  margin: 15px 0;
  line-height: 1.5;
  border-radius: 5px;
}

.mode {
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  background: #fff3cd;
  color: #856404;
  font-weight: bold;
  margin-bottom: 15px;
}

video,
#preview {
  width: 100%;
  max-width: 500px;
  display: block;
  margin: 15px auto;
  border-radius: 10px;
  background: #111;
}

#preview {
  display: none;
}

#canvas {
  display: none;
}

.buttons {
  text-align: center;
  margin-top: 15px;
}

button {
  border: none;
  padding: 13px 18px;
  margin: 5px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  background: #aaa !important;
  cursor: not-allowed;
}

.camera {
  background: #1976d2;
  color: white;
}

.capture {
  background: #2e7d32;
  color: white;
}

.retake {
  background: #f57c00;
  color: white;
}

.download {
  background: #6a1b9a;
  color: white;
}

.submit {
  background: #00897b;
  color: white;
}

.back {
  background: #555;
  color: white;
}

#status {
  padding: 13px;
  margin-top: 15px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
  display: none;
  line-height: 1.5;
}

.success {
  background: #dff5e1;
  color: #176b24;
}

.error {
  background: #ffe0e0;
  color: #a00000;
}

.infoStatus {
  background: #e5f0ff;
  color: #174a8b;
}

#downloadSection,
#submissionSection {
  display: none;
  text-align: center;
  margin-top: 20px;
}

.small {
  font-size: 13px;
  color: #666;
  text-align: center;
  margin-top: 10px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Live Photo Verification</h1>

<div class="mode" id="modeText">
Loading verification type...
</div>

<div class="info">

<div>
<strong>Student ID:</strong>
<span id="studentId">Loading...</span>
</div>

<div>
<strong>Question Paper ID:</strong>
<span id="questionPaperId">Loading...</span>
</div>

</div>

<div class="instruction" id="instructionText">
Please wait...
</div>

<video
id="video"
autoplay
playsinline>
</video>

<canvas id="canvas"></canvas>

<img
id="preview"
alt="Live Photo Preview">

<div class="buttons">

<button
id="startCameraBtn"
class="camera"
onclick="startCamera()">
📷 Start Camera
</button>

<button
id="captureBtn"
class="capture"
onclick="capturePhoto()"
disabled>
📸 Take Live Photo
</button>

<button
id="retakeBtn"
class="retake"
onclick="retakePhoto()"
style="display:none;">
🔄 Retake Photo
</button>

</div>

<div id="status"></div>


<!-- DOWNLOAD RESULT -->

<div id="downloadSection">

<p>
<strong>✅ Download verification completed.</strong>
</p>

<button
class="download"
onclick="downloadQuestionPaper()">
📄 Download Question Paper
</button>

</div>


<!-- SUBMISSION RESULT -->

<div id="submissionSection">

<p>
<strong>✅ Submission verification completed.</strong>
</p>

<p>
You can now continue to upload your answer sheet.
</p>

<button
class="submit"
onclick="continueSubmission()">
📤 Continue to Submit Answer Sheet
</button>

</div>


<div class="buttons">

<button
class="back"
onclick="goBack()">
← Back
</button>

</div>

<div class="small">
Your live photo is recorded for verification.
</div>

</div>

</div>


<script>


/****************************************************
 * API
 ****************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


/****************************************************
 * URL PARAMETERS
 ****************************************************/

const params =
new URLSearchParams(
window.location.search
);


const studentId =
localStorage.getItem("studentId") ||
localStorage.getItem("studentID") ||
params.get("studentId") ||
"";


const questionPaperId =
params.get("questionPaperId") ||
params.get("paperId") ||
"";


/*
 * IMPORTANT
 *
 * download
 * OR
 * submission
 */

const verificationType =
(
  params.get("type") ||
  "download"
).toLowerCase();


/****************************************************
 * DISPLAY
 ****************************************************/

document.getElementById(
"studentId"
).textContent =
studentId || "Not Found";


document.getElementById(
"questionPaperId"
).textContent =
questionPaperId || "Not Found";


/****************************************************
 * MODE
 ****************************************************/

if (
verificationType === "submission"
) {

  document.getElementById(
  "modeText"
  ).textContent =
  "📤 Answer Sheet Submission Verification";

  document.getElementById(
  "instructionText"
  ).textContent =
  "Please take a NEW live photo before submitting your answer sheet. This photo will be recorded with your submission.";

}

else {

  document.getElementById(
  "modeText"
  ).textContent =
  "📄 Question Paper Download Verification";

  document.getElementById(
  "instructionText"
  ).textContent =
  "Please take a live photo before downloading the question paper. This photo will be recorded for your download verification.";

}


/****************************************************
 * VARIABLES
 ****************************************************/

let stream = null;

let capturedImage = "";

let uploadedLivePhotoUrl = "";


/****************************************************
 * STATUS
 ****************************************************/

function showStatus(
message,
type
) {

  const box =
  document.getElementById(
  "status"
  );

  box.textContent =
  message;

  box.className = "";

  if (
  type === "success"
  ) {

    box.classList.add(
    "success"
    );

  }

  if (
  type === "error"
  ) {

    box.classList.add(
    "error"
    );

  }

  if (
  type === "info"
  ) {

    box.classList.add(
    "infoStatus"
    );

  }

  box.style.display =
  "block";

}


/****************************************************
 * START CAMERA
 ****************************************************/

async function startCamera() {

  if (!studentId) {

    showStatus(
      "Student ID is missing.",
      "error"
    );

    return;
  }


  if (!questionPaperId) {

    showStatus(
      "Question Paper ID is missing.",
      "error"
    );

    return;
  }


  try {

    showStatus(
      "Starting camera...",
      "info"
    );


    stream =
    await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: "user",

        width: {
          ideal: 640
        },

        height: {
          ideal: 640
        }

      },

      audio: false

    });


    const video =
    document.getElementById(
    "video"
    );


    video.srcObject =
    stream;


    document.getElementById(
    "captureBtn"
    ).disabled =
    false;


    document.getElementById(
    "startCameraBtn"
    ).style.display =
    "none";


    showStatus(
      "Camera started. Please look at the camera and take your live photo.",
      "info"
    );

  }

  catch(error) {

    console.error(error);

    showStatus(
      "Camera could not be started. Please allow camera permission and try again.",
      "error"
    );

  }

}


/****************************************************
 * CAPTURE PHOTO
 ****************************************************/

function capturePhoto() {

  const video =
  document.getElementById(
  "video"
  );


  const canvas =
  document.getElementById(
  "canvas"
  );


  if (!video.videoWidth) {

    showStatus(
      "Camera is not ready.",
      "error"
    );

    return;
  }


  let width =
  video.videoWidth;


  let height =
  video.videoHeight;


  const maxWidth =
  650;


  if (
  width > maxWidth
  ) {

    const ratio =
    maxWidth / width;


    width =
    maxWidth;


    height =
    Math.round(
      height * ratio
    );

  }


  canvas.width =
  width;


  canvas.height =
  height;


  const ctx =
  canvas.getContext(
  "2d"
  );


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
   * Compress photo.
   */

  capturedImage =
  canvas.toDataURL(
    "image/jpeg",
    0.60
  );


  document.getElementById(
  "preview"
  ).src =
  capturedImage;


  document.getElementById(
  "preview"
  ).style.display =
  "block";


  video.style.display =
  "none";


  document.getElementById(
  "captureBtn"
  ).style.display =
  "none";


  document.getElementById(
  "retakeBtn"
  ).style.display =
  "inline-block";


  showStatus(
    "Photo captured. Uploading verification...",
    "info"
  );


  uploadLivePhoto();

}


/****************************************************
 * UPLOAD LIVE PHOTO
 ****************************************************/

async function uploadLivePhoto() {

  if (
    !studentId ||
    !questionPaperId ||
    !capturedImage
  ) {

    showStatus(
      "Student ID, Question Paper ID and photo are required.",
      "error"
    );

    return;
  }


  try {

    /*
     * JSON request
     */

    const payload = {

      action:
      "uploadLivePhoto",

      studentId:
      studentId,

      questionPaperId:
      questionPaperId,

      verificationType:
      verificationType,

      image:
      capturedImage

    };


    console.log(
      "LIVE PHOTO REQUEST:",
      verificationType
    );


    const response =
    await fetch(
      API_URL,
      {

        method:
        "POST",

        headers: {

          "Content-Type":
          "application/json"

        },

        body:
        JSON.stringify(
          payload
        )

      }
    );


    const text =
    await response.text();


    console.log(
      "LIVE PHOTO RESPONSE:",
      text
    );


    let result;


    try {

      result =
      JSON.parse(
        text
      );

    }

    catch(error) {

      throw new Error(
        "Server returned invalid JSON: " +
        text.substring(
          0,
          200
        )
      );

    }


    if (
    !result.success
    ) {

      throw new Error(
        result.message ||
        "Live photo upload failed."
      );

    }


    uploadedLivePhotoUrl =
    result.url ||
    result.fileUrl ||
    result.livePhotoUrl ||
    result.fileURL ||
    "";


    /*
     * Separate storage keys
     */

    const key =
      "livePhoto_" +
      verificationType +
      "_" +
      studentId +
      "_" +
      questionPaperId;


    const verificationData = {

      verified:
      true,

      verificationType:
      verificationType,

      studentId:
      studentId,

      questionPaperId:
      questionPaperId,

      livePhotoUrl:
      uploadedLivePhotoUrl,

      verifiedAt:
      new Date().toISOString()

    };


    localStorage.setItem(

      key,

      JSON.stringify(
        verificationData
      )

    );


    /*
     * Also store direct URL
     */

    localStorage.setItem(

      "livePhotoUrl_" +
      verificationType +
      "_" +
      studentId +
      "_" +
      questionPaperId,

      uploadedLivePhotoUrl

    );


    /*
     * Stop camera
     */

    stopCamera();


    /*
     * Show correct next step
     */

    if (
    verificationType ===
    "submission"
    ) {

      document.getElementById(
      "submissionSection"
      ).style.display =
      "block";


      showStatus(
        "✅ New live photo verification completed successfully.",
        "success"
      );

    }

    else {

      document.getElementById(
      "downloadSection"
      ).style.display =
      "block";


      showStatus(
        "✅ Live photo verification completed successfully.",
        "success"
      );

    }


  }

  catch(error) {

    console.error(
      "LIVE PHOTO ERROR:",
      error
    );


    showStatus(
      "Live photo verification failed: " +
      error.message,
      "error"
    );

  }

}


/****************************************************
 * RETAKE PHOTO
 ****************************************************/

function retakePhoto() {

  capturedImage =
  "";

  uploadedLivePhotoUrl =
  "";


  document.getElementById(
  "preview"
  ).style.display =
  "none";


  document.getElementById(
  "retakeBtn"
  ).style.display =
  "none";


  document.getElementById(
  "captureBtn"
  ).style.display =
  "inline-block";


  document.getElementById(
  "captureBtn"
  ).disabled =
  true;


  startCamera();

}


/****************************************************
 * STOP CAMERA
 ****************************************************/

function stopCamera() {

  if (stream) {

    stream
    .getTracks()
    .forEach(
      function(track) {

        track.stop();

      }
    );

    stream =
    null;

  }

}


/****************************************************
 * DOWNLOAD QUESTION PAPER
 ****************************************************/

async function downloadQuestionPaper() {

  const key =
    "livePhoto_download_" +
    studentId +
    "_" +
    questionPaperId;


  const saved =
    localStorage.getItem(
      key
    );


  if (!saved) {

    showStatus(
      "Please complete live photo verification first.",
      "error"
    );

    return;
  }


  let verification;


  try {

    verification =
    JSON.parse(
      saved
    );

  }

  catch(error) {

    showStatus(
      "Verification data is invalid. Please retake the photo.",
      "error"
    );

    return;

  }


  if (
  !verification.verified
  ) {

    showStatus(
      "Please complete live photo verification first.",
      "error"
    );

    return;

  }


  try {

    showStatus(
      "Loading question paper...",
      "info"
    );


    const response =
    await fetch(

      API_URL +
      "?action=getQuestionPapers"

    );


    const result =
    await response.json();


    if (
    !result.success
    ) {

      throw new Error(
        result.message ||
        "Unable to load question papers."
      );

    }


    const papers =
    result.papers ||
    result.data ||
    result.rows ||
    [];


    const paper =
    papers.find(

      function(p) {

        return String(

          p.QuestionPaperID ||
          p.questionPaperId ||
          p.id ||
          ""

        ) ===

        String(
          questionPaperId
        );

      }

    );


    if (!paper) {

      throw new Error(
        "Question paper not found."
      );

    }


    const fileUrl =
    paper.FileURL ||
    paper.fileURL ||
    paper.fileUrl ||
    paper.FileUrl ||
    "";


    if (!fileUrl) {

      throw new Error(
        "Question paper file URL is missing."
      );

    }


    /*
     * Save download live photo.
     */

    localStorage.setItem(

      "activeDownloadLivePhotoUrl",

      verification.livePhotoUrl ||
      ""

    );


    /*
     * Open paper.
     */

    window.open(
      fileUrl,
      "_blank"
    );


    showStatus(
      "Question paper opened successfully.",
      "success"
    );

  }

  catch(error) {

    console.error(error);

    showStatus(
      error.message,
      "error"
    );

  }

}


/****************************************************
 * CONTINUE SUBMISSION
 ****************************************************/

function continueSubmission() {

  /*
   * IMPORTANT:
   * Send the student to submit-answer.html
   * only after the NEW submission live photo
   * has been successfully recorded.
   */

  const key =
    "livePhoto_submission_" +
    studentId +
    "_" +
    questionPaperId;


  const saved =
    localStorage.getItem(
      key
    );


  if (!saved) {

    showStatus(
      "Submission live photo verification is required.",
      "error"
    );

    return;
  }


  let data;


  try {

    data =
    JSON.parse(
      saved
    );

  }

  catch(error) {

    showStatus(
      "Invalid submission verification data.",
      "error"
    );

    return;

  }


  if (
  !data.verified
  ) {

    showStatus(
      "Please complete submission verification first.",
      "error"
    );

    return;

  }


  /*
   * Save URL for submit-answer.html
   */

  localStorage.setItem(

    "submissionLivePhotoUrl",

    data.livePhotoUrl ||
    ""

  );


  /*
   * Open answer submission page.
   */

  window.location.href =
    "submit-answer.html?questionPaperId=" +
    encodeURIComponent(
      questionPaperId
    );

}


/****************************************************
 * BACK
 ****************************************************/

function goBack() {

  stopCamera();


  if (
  verificationType ===
  "submission"
  ) {

    window.location.href =
      "submit-answer.html?questionPaperId=" +
      encodeURIComponent(
        questionPaperId
      );

  }

  else {

    window.location.href =
      "question-papers.html";

  }

}


/****************************************************
 * CLEANUP
 ****************************************************/

window.addEventListener(
"beforeunload",
function() {

  stopCamera();

});

</script>

</body>
</html>
