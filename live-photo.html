<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Live Photo Verification</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #111827;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.10);
}

h1 {
  text-align: center;
  margin-top: 0;
}

.mode {
  text-align: center;
  padding: 12px;
  border-radius: 10px;
  background: #eef2ff;
  margin-bottom: 20px;
  font-weight: bold;
}

.instructions {
  background: #f8fafc;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.6;
  margin-bottom: 20px;
}

.camera-box {
  width: 100%;
  background: #111827;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}

video {
  width: 100%;
  display: block;
  background: black;
}

canvas {
  display: none;
}

.preview {
  width: 100%;
  display: none;
  border-radius: 12px;
}

button {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 12px;
}

.start {
  background: #2563eb;
  color: white;
}

.capture {
  background: #059669;
  color: white;
}

.continue {
  background: #7c3aed;
  color: white;
}

.back {
  background: #64748b;
  color: white;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.message {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  display: none;
  line-height: 1.5;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.info {
  background: #dbeafe;
  color: #1e40af;
}

.hidden {
  display: none !important;
}

</style>

</head>

<body>

<div class="container">

  <div class="card">

    <h1>Live Photo Verification</h1>

    <div
      id="modeBox"
      class="mode"
    >
      Loading...
    </div>

    <div class="instructions">

      <strong>Please follow these instructions:</strong>

      <ul>

        <li>Allow camera permission.</li>

        <li>Keep your face clearly visible.</li>

        <li>Make sure the photo is clear.</li>

        <li>Take a new live photo.</li>

        <li>The live photo is checked only in this browser.</li>

        <li>The live photo is NOT uploaded to Google Drive.</li>

      </ul>

    </div>


    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

      <canvas
        id="canvas"
      ></canvas>

      <img
        id="preview"
        class="preview"
        alt="Live Photo Preview"
      >

    </div>


    <button
      id="startButton"
      class="start"
      onclick="startCamera()"
    >
      📷 Start Camera
    </button>


    <button
      id="captureButton"
      class="capture hidden"
      onclick="capturePhoto()"
    >
      📸 Take Live Photo
    </button>


    <button
      id="continueButton"
      class="continue hidden"
      onclick="continueProcess()"
    >
      Continue
    </button>


    <button
      id="backButton"
      class="back"
      onclick="goBack()"
    >
      ← Back
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </div>

</div>


<script>

/*******************************************************
 * READ URL
 *******************************************************/

const params =
  new URLSearchParams(
    window.location.search
  );


const questionPaperId =
  params.get(
    "questionPaperId"
  ) || "";


const type =
  (
    params.get(
      "type"
    ) || "download"
  )
  .toLowerCase();


const studentId =
  localStorage.getItem(
    "studentId"
  ) ||
  localStorage.getItem(
    "StudentID"
  ) ||
  "";


/*******************************************************
 * ELEMENTS
 *******************************************************/

const video =
  document.getElementById(
    "video"
  );


const canvas =
  document.getElementById(
    "canvas"
  );


const preview =
  document.getElementById(
    "preview"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const captureButton =
  document.getElementById(
    "captureButton"
  );


const continueButton =
  document.getElementById(
    "continueButton"
  );


const message =
  document.getElementById(
    "message"
  );


const modeBox =
  document.getElementById(
    "modeBox"
  );


/*******************************************************
 * CAMERA
 *******************************************************/

let stream = null;

let capturedPhoto = "";


/*******************************************************
 * MODE
 *******************************************************/

if (
  type === "submission"
) {

  modeBox.textContent =
    "Answer Sheet Submission – New Live Photo";

} else {

  modeBox.textContent =
    "Question Paper Download – Live Photo";

}


/*******************************************************
 * MESSAGE
 *******************************************************/

function showMessage(
  text,
  typeName
) {

  message.textContent =
    text;

  message.className =
    "message " +
    typeName;

  message.style.display =
    "block";
}


/*******************************************************
 * START CAMERA
 *******************************************************/

async function startCamera() {

  try {

    stopCamera();


    showMessage(
      "Starting camera...",
      "info"
    );


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode:
            "user",

          width: {
            ideal: 720
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    startButton.classList.add(
      "hidden"
    );


    captureButton.classList.remove(
      "hidden"
    );


    preview.style.display =
      "none";


    showMessage(
      "Camera is ready. Please take your live photo.",
      "info"
    );


  } catch (error) {

    console.error(
      error
    );


    showMessage(

      "Camera could not be started. " +
      "Please allow camera permission and make sure no other application is using the camera.",

      "error"

    );
  }
}


/*******************************************************
 * CAPTURE PHOTO
 *******************************************************/

function capturePhoto() {

  if (
    !stream
  ) {

    showMessage(
      "Please start the camera first.",
      "error"
    );

    return;
  }


  const width =
    video.videoWidth || 640;


  const height =
    video.videoHeight || 640;


  const maxWidth =
    650;


  let targetWidth =
    width;


  let targetHeight =
    height;


  if (
    width > maxWidth
  ) {

    targetWidth =
      maxWidth;


    targetHeight =
      Math.round(
        height *
        maxWidth /
        width
      );
  }


  canvas.width =
    targetWidth;


  canvas.height =
    targetHeight;


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.drawImage(

    video,

    0,

    0,

    targetWidth,

    targetHeight

  );


  capturedPhoto =
    canvas.toDataURL(
      "image/jpeg",
      0.60
    );


  preview.src =
    capturedPhoto;


  preview.style.display =
    "block";


  stopCamera();


  captureButton.classList.add(
    "hidden"
  );


  continueButton.classList.remove(
    "hidden"
  );


  showMessage(

    "✅ Live photo captured. Click Continue.",

    "success"

  );
}


/*******************************************************
 * CONTINUE
 *******************************************************/

function continueProcess() {

  if (
    !capturedPhoto
  ) {

    showMessage(
      "Please take a live photo first.",
      "error"
    );

    return;
  }


  /*
   * LIVE PHOTO IS STORED ONLY IN BROWSER.
   *
   * No Google Drive.
   * No Apps Script.
   */


  if (
    type === "submission"
  ) {

    /*
     * Mark submission verification.
     */
    localStorage.setItem(

      "submissionLivePhotoCaptured_" +
      studentId +
      "_" +
      questionPaperId,

      "yes"

    );


    /*
     * Store a small browser copy.
     * This is not uploaded anywhere.
     */
    localStorage.setItem(

      "submissionLivePhotoLocal",

      capturedPhoto

    );


    showMessage(

      "✅ Live photo completed. Returning to answer sheet...",

      "success"

    );


    setTimeout(
      function() {

        /*
         * If this page was opened in a new tab,
         * close it and return to original page.
         */
        if (
          window.opener &&
          !window.opener.closed
        ) {

          window.close();

          return;
        }


        /*
         * Fallback.
         */
        window.location.href =
          "submit-answer.html" +
          "?questionPaperId=" +
          encodeURIComponent(
            questionPaperId
          );

      },
      900
    );


  } else {

    /*
     * DOWNLOAD VERIFICATION
     */
    localStorage.setItem(

      "downloadLivePhotoCaptured_" +
      studentId +
      "_" +
      questionPaperId,

      "yes"

    );


    localStorage.setItem(

      "downloadLivePhotoLocal",

      capturedPhoto

    );


    showMessage(

      "✅ Live photo completed. Opening question paper...",

      "success"

    );


    setTimeout(
      function() {

        openQuestionPaper();

      },
      900
    );
  }
}


/*******************************************************
 * OPEN QUESTION PAPER
 *******************************************************/

async function openQuestionPaper() {

  try {

    if (
      !questionPaperId
    ) {

      throw new Error(
        "Question Paper ID is missing."
      );
    }


    const apiUrl =
      "https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


    const url =
      apiUrl +
      "?action=getQuestionPapers";


    const response =
      await fetch(
        url
      );


    const data =
      await response.json();


    if (
      !data.success
    ) {

      throw new Error(
        data.message ||
        "Could not load question papers."
      );
    }


    const papers =
      data.papers || [];


    const paper =
      papers.find(
        function(p) {

          return (

            String(
              p.QuestionPaperID
            ).trim() ===

            String(
              questionPaperId
            ).trim()

          );

        }
      );


    if (
      !paper
    ) {

      throw new Error(
        "Question paper not found."
      );
    }


    const fileUrl =
      String(
        paper.FileURL || ""
      ).trim();


    if (
      !fileUrl
    ) {

      throw new Error(
        "Question paper file URL is missing."
      );
    }


    window.location.href =
      fileUrl;


  } catch (error) {

    console.error(
      error
    );


    showMessage(

      "Question paper could not be opened: " +
      error.message,

      "error"

    );
  }
}


/*******************************************************
 * STOP CAMERA
 *******************************************************/

function stopCamera() {

  if (
    stream
  ) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    stream =
      null;
  }


  if (
    video
  ) {

    video.srcObject =
      null;
  }
}


/*******************************************************
 * BACK
 *******************************************************/

function goBack() {

  stopCamera();


  if (
    type === "submission"
  ) {

    window.location.href =
      "submit-answer.html" +
      "?questionPaperId=" +
      encodeURIComponent(
        questionPaperId
      );

  } else {

    window.location.href =
      "question-papers.html";
  }
}


/*******************************************************
 * PAGE HIDE
 *******************************************************/

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.hidden
    ) {

      stopCamera();
    }

  }
);


/*******************************************************
 * PAGE LEAVE
 *******************************************************/

window.addEventListener(
  "pagehide",
  function() {

    stopCamera();

  }
);


/*******************************************************
 * INITIAL CHECK
 *******************************************************/

if (
  !studentId
) {

  showMessage(

    "Student login information was not found. Please login again.",

    "error"

  );
}


if (
  !questionPaperId
) {

  showMessage(

    "Question Paper ID is missing.",

    "error"

  );
}

</script>

</body>
</html>
