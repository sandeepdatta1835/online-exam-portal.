<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Exam - Student Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
}
header{
    background:#1f2937;
    color:white;
    padding:18px;
}
.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}
.card{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
button{
    padding:13px 16px;
    border:0;
    border-radius:8px;
    margin:5px;
    cursor:pointer;
}
.primary{
    background:#2563eb;
    color:white;
}
.success{
    background:#16a34a;
    color:white;
}
.danger{
    background:#dc2626;
    color:white;
}
.subject{
    display:inline-block;
    background:#eef2ff;
    padding:8px 12px;
    margin:5px;
    border-radius:15px;
}
</style>
</head>

<body>

<header>
<h2>Online Exam</h2>
<div>Student Dashboard</div>
</header>

<div class="container">

<div class="card">

<h2 id="studentName">
Loading...
</h2>

<p>
<b>Student ID:</b>
<span id="studentId"></span>
</p>

<p>
<b>Enrollment No:</b>
<span id="enrollment"></span>
</p>

<p>
<b>Board:</b>
<span id="board"></span>
</p>

<p>
<b>Class:</b>
<span id="className"></span>
</p>

</div>


<div class="card">

<h3>My Assigned Subjects</h3>

<div id="subjects">
Loading...
</div>

</div>


<div class="card">

<h3>Quick Actions</h3>

<button
class="primary"
onclick="location.href='question-papers.html'">
Question Papers
</button>

<button
class="success"
onclick="location.href='result.html'">
My Results
</button>

<button
class="danger"
onclick="logout()">
Logout
</button>

</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";

const studentId =
localStorage.getItem("studentId");

if(!studentId){
    location.href="login.html";
}

document.getElementById("studentId")
.textContent = studentId;


function api(action){

    return new Promise(
        (resolve,reject)=>{

            const callback =
                "cb_" +
                Date.now() +
                "_" +
                Math.floor(
                    Math.random()*10000
                );

            const script =
                document.createElement(
                    "script"
                );

            window[callback] =
                function(data){

                    delete window[callback];

                    script.remove();

                    if(data.success){
                        resolve(data);
                    }else{
                        reject(
                            new Error(
                                data.message ||
                                "Error"
                            )
                        );
                    }
                };

            script.src =
                API +
                "?action=" +
                encodeURIComponent(action) +
                "&studentId=" +
                encodeURIComponent(studentId) +
                "&callback=" +
                callback;

            script.onerror =
                () =>
                reject(
                    new Error(
                        "API connection failed."
                    )
                );

            document.body.appendChild(
                script
            );
        }
    );
}


async function loadStudent(){

    try{

        const result =
            await api("getStudent");

        const s =
            result.student;

        document.getElementById(
            "studentName"
        ).textContent =
        s.studentName;

        document.getElementById(
            "enrollment"
        ).textContent =
        s.enrollmentNo || "-";

        document.getElementById(
            "board"
        ).textContent =
        s.board || "-";

        document.getElementById(
            "className"
        ).textContent =
        s.className || "-";

        const subjects =
            s.studentSubjects || [];

        const box =
            document.getElementById(
                "subjects"
            );

        if(!subjects.length){

            box.innerHTML =
            "No subjects assigned.";

            return;
        }

        box.innerHTML =
            subjects.map(
                x =>
                `<span class="subject">
                ${x.subjectCode} -
                ${x.subjectName}
                </span>`
            ).join("");

    }catch(err){

        document.getElementById(
            "subjects"
        ).textContent =
        err.message;
    }
}


function logout(){

    localStorage.removeItem(
        "studentId"
    );

    localStorage.removeItem(
        "studentName"
    );

    location.href =
        "login.html";
}


loadStudent();

</script>

</body>
</html>
