<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Exam - Student Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#1d4ed8;
    color:white;
    padding:20px;
}

.container{
    width:94%;
    max-width:1100px;
    margin:20px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.student-id{
    font-size:24px;
    font-weight:bold;
    color:#1d4ed8;
}

.subject{
    display:inline-block;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    padding:12px;
    margin:5px;
    border-radius:8px;
}

button{
    background:#1d4ed8;
    color:white;
    border:0;
    padding:12px 18px;
    border-radius:6px;
    margin:5px;
    cursor:pointer;
}

.logout{
    background:#dc2626;
}

.paper{
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px;
    margin:10px 0;
}

.success{
    color:#15803d;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<div class="container">
<h1>Online Exam</h1>
<p>Student Dashboard</p>
</div>
</header>

<div class="container">

<div class="card">

<h2>Welcome</h2>

<p class="student-id">
Student ID:
<span id="studentId"></span>
</p>

<p>
<strong>Name:</strong>
<span id="studentName"></span>
</p>

<p>
<strong>Enrollment:</strong>
<span id="enrollment"></span>
</p>

<p>
<strong>Board:</strong>
<span id="board"></span>
</p>

<p>
<strong>Class:</strong>
<span id="studentClass"></span>
</p>

</div>


<div class="card">

<h2>My Assigned Subjects</h2>

<div id="subjects">
Loading subjects...
</div>

</div>


<div class="card">

<h2>My Published Question Papers</h2>

<div id="papers">
Loading question papers...
</div>

</div>


<div class="card">

<h2>Quick Actions</h2>

<button onclick="location.href='question-papers.html'">
Question Papers
</button>

<button onclick="location.href='submit-answer.html'">
Submit Answer
</button>

<button onclick="location.href='result.html'">
My Results
</button>

<button onclick="location.href='online-exam.html'">
Online Exams
</button>

<button class="logout"
        onclick="logout()">
Logout
</button>

</div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


const studentId =
    localStorage.getItem("studentId");

if(!studentId){

    window.location.href =
        "login.html";
}


function api(action, params = {}){

    return new Promise(function(resolve,reject){

        const callbackName =
            "cb_" +
            Date.now() +
            Math.floor(Math.random()*10000);

        const script =
            document.createElement("script");

        const query =
            new URLSearchParams();

        query.append("action",action);
        query.append("callback",callbackName);

        Object.keys(params).forEach(function(key){

            query.append(
                key,
                params[key]
            );

        });

        window[callbackName] =
            function(data){

                delete window[callbackName];

                script.remove();

                resolve(data);
            };

        script.onerror =
            function(){

                delete window[callbackName];

                script.remove();

                reject(
                    new Error("API connection failed")
                );
            };

        script.src =
            API + "?" + query.toString();

        document.body.appendChild(script);
    });
}


async function loadStudent(){

    const result =
        await api(
            "getStudent",
            {
                studentId:
                    studentId
            }
        );

    if(!result.success){

        alert(result.message);

        logout();

        return;
    }

    const student =
        result.data;

    document.getElementById(
        "studentId"
    ).textContent =
        student.studentId;

    document.getElementById(
        "studentName"
    ).textContent =
        student.studentName;

    document.getElementById(
        "enrollment"
    ).textContent =
        student.enrollmentNo || "-";

    document.getElementById(
        "board"
    ).textContent =
        student.board || "-";

    document.getElementById(
        "studentClass"
    ).textContent =
        student.studentClass || "-";

    loadSubjects(
        student.studentSubjects || []
    );

    loadPapers();
}


function loadSubjects(subjects){

    const box =
        document.getElementById(
            "subjects"
        );

    if(subjects.length === 0){

        box.innerHTML =
            "<p>No subjects have been assigned yet.</p>";

        return;
    }

    box.innerHTML = "";

    subjects.forEach(function(subject){

        box.innerHTML += `
            <div class="subject">
                <strong>
                    ${escapeHtml(subject.subjectCode)}
                </strong>
                -
                ${escapeHtml(subject.subjectName)}
                <br>
                ${escapeHtml(subject.board)}
                | Class ${escapeHtml(subject.studentClass)}
            </div>
        `;
    });
}


async function loadPapers(){

    const result =
        await api(
            "getPublishedQuestionPapers",
            {
                studentId:
                    studentId
            }
        );

    const box =
        document.getElementById(
            "papers"
        );

    if(!result.success){

        box.innerHTML =
            "<p>" +
            escapeHtml(result.message) +
            "</p>";

        return;
    }

    const papers =
        result.data || [];

    if(papers.length === 0){

        box.innerHTML =
            "<p>No published question papers available.</p>";

        return;
    }

    box.innerHTML = "";

    papers.forEach(function(paper){

        box.innerHTML += `
            <div class="paper">

                <h3>
                    ${escapeHtml(paper.paperName)}
                </h3>

                <p>
                    <strong>Subject:</strong>
                    ${escapeHtml(paper.subjectCode)}
                    -
                    ${escapeHtml(paper.subjectName)}
                </p>

                <p>
                    <strong>Year:</strong>
                    ${escapeHtml(paper.year)}
                </p>

                <p class="success">
                    Published
                </p>

                ${
                    paper.fileUrl
                    ?
                    `<a href="${escapeHtml(paper.fileUrl)}"
                        target="_blank">
                        Open Question Paper
                    </a>`
                    :
                    "Question paper file not added."
                }

                <br><br>

                <button onclick="
                    window.location.href =
                    'submit-answer.html?questionPaperId=${encodeURIComponent(paper.questionPaperId)}&subjectId=${encodeURIComponent(paper.subjectId)}'
                ">
                    Submit Answer
                </button>

            </div>
        `;
    });
}


function logout(){

    localStorage.removeItem("studentId");
    localStorage.removeItem("studentName");
    localStorage.removeItem("enrollment");
    localStorage.removeItem("mobile");
    localStorage.removeItem("email");
    localStorage.removeItem("board");
    localStorage.removeItem("studentClass");
    localStorage.removeItem("studentSubjects");

    window.location.href =
        "login.html";
}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


loadStudent();

</script>

</body>
</html>
