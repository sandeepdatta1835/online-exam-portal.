<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Online Exam - Submit Answer</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#1d4ed8;
    color:white;
    padding:20px;
}

.container{
    width:94%;
    max-width:800px;
    margin:20px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.info{
    background:#eff6ff;
    padding:15px;
    border-left:5px solid #2563eb;
    margin-bottom:20px;
}

input,
textarea{
    width:100%;
    padding:12px;
    margin:7px 0 15px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    background:#1d4ed8;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
}

.success{
    background:#dcfce7;
    color:#166534;
    padding:15px;
    margin-top:15px;
    display:none;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    margin-top:15px;
    display:none;
}
</style>
</head>

<body>

<header>
<div class="container">
<h1>Online Exam</h1>
<p>Submit Answer Sheet</p>
</div>
</header>

<div class="container">

<div class="card">

<h2>Answer Sheet Submission</h2>

<div class="info">

<p>
<strong>Student ID:</strong>
<span id="studentId"></span>
</p>

<p>
<strong>Student Name:</strong>
<span id="studentName"></span>
</p>

<p>
<strong>Question Paper:</strong>
<span id="paperName">Loading...</span>
</p>

<p>
<strong>Subject:</strong>
<span id="subjectName">Loading...</span>
</p>

</div>


<label>
Google Drive Answer Sheet Link
</label>

<input
    type="url"
    id="answerFileUrl"
    placeholder="Paste your Google Drive answer sheet link"
>


<label>
Remarks
</label>

<textarea
    id="remarks"
    rows="4"
    placeholder="Optional message for admin"
></textarea>


<button onclick="submitAnswer()">
Submit Answer Sheet
</button>


<div id="success"
     class="success">
</div>

<div id="error"
     class="error">
</div>

<br><br>

<button onclick="
location.href='student-dashboard.html'
">
Back to Dashboard
</button>

</div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


const studentId =
    localStorage.getItem("studentId");


if(!studentId){

    location.href =
        "login.html";
}


const params =
    new URLSearchParams(
        window.location.search
    );


const questionPaperId =
    params.get(
        "questionPaperId"
    ) || "";


const subjectId =
    params.get(
        "subjectId"
    ) || "";


document.getElementById(
    "studentId"
).textContent =
    studentId;


document.getElementById(
    "studentName"
).textContent =
    localStorage.getItem(
        "studentName"
    ) || "";


function api(action,params={}){

    return new Promise(function(resolve,reject){

        const callback =
            "cb_" +
            Date.now() +
            Math.floor(Math.random()*10000);

        const script =
            document.createElement("script");

        const query =
            new URLSearchParams();

        query.append(
            "action",
            action
        );

        query.append(
            "callback",
            callback
        );

        Object.keys(params).forEach(function(key){

            query.append(
                key,
                params[key]
            );

        });

        window[callback] =
            function(data){

                delete window[callback];

                script.remove();

                resolve(data);
            };

        script.onerror =
            function(){

                delete window[callback];

                script.remove();

                reject(
                    new Error(
                        "API connection failed"
                    )
                );
            };

        script.src =
            API + "?" + query.toString();

        document.body.appendChild(
            script
        );
    });
}


async function loadPaper(){

    if(!questionPaperId){

        document.getElementById(
            "paperName"
        ).textContent =
            "No question paper selected.";

        return;
    }

    try{

        const result =
            await api(
                "getPublishedQuestionPapers",
                {
                    studentId:
                        studentId
                }
            );

        if(!result.success){

            showError(
                result.message
            );

            return;
        }

        const papers =
            result.data || [];

        const paper =
            papers.find(
                function(item){

                    return item.questionPaperId ===
                        questionPaperId;
                }
            );

        if(!paper){

            showError(
                "This question paper is not assigned or published for your Student ID."
            );

            return;
        }

        document.getElementById(
            "paperName"
        ).textContent =
            paper.paperName;

        document.getElementById(
            "subjectName"
        ).textContent =
            paper.subjectCode +
            " - " +
            paper.subjectName;

    }catch(error){

        showError(
            error.message
        );
    }
}


async function submitAnswer(){

    const answerFileUrl =
        document.getElementById(
            "answerFileUrl"
        ).value.trim();

    const remarks =
        document.getElementById(
            "remarks"
        ).value.trim();

    if(!questionPaperId){

        showError(
            "Question Paper ID is missing."
        );

        return;
    }

    if(!answerFileUrl){

        showError(
            "Please enter the Google Drive answer sheet link."
        );

        return;
    }

    try{

        const result =
            await api(
                "submitAnswer",
                {
                    studentId:
                        studentId,

                    examId:"",

                    subjectId:
                        subjectId,

                    questionPaperId:
                        questionPaperId,

                    submissionType:
                        "Answer Sheet",

                    answerFileUrl:
                        answerFileUrl,

                    evaluatorRemarks:
                        remarks
                }
            );

        if(result.success){

            document.getElementById(
                "success"
            ).textContent =
                result.message +
                " Submission ID: " +
                result.submissionId;

            document.getElementById(
                "success"
            ).style.display =
                "block";

            document.getElementById(
                "error"
            ).style.display =
                "none";

            document.getElementById(
                "answerFileUrl"
            ).value = "";

            document.getElementById(
                "remarks"
            ).value = "";

        }else{

            showError(
                result.message
            );
        }

    }catch(error){

        showError(
            error.message
        );
    }
}


function showError(message){

    document.getElementById(
        "error"
    ).textContent =
        message;

    document.getElementById(
        "error"
    ).style.display =
        "block";

    document.getElementById(
        "success"
    ).style.display =
        "none";
}


loadPaper();

</script>

</body>
</html>
