<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Submit Answer Sheet</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

h1{
    margin-top:0;
}

.paper{
    background:#f1f5f9;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

input[type=file]{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#1976d2;
    color:white;
    font-size:16px;
    margin-top:15px;
}

button:disabled{
    background:#aaa;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    background:#f1f5f9;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.small{
    font-size:13px;
    color:#555;
}

</style>

</head>

<body>

<div class="container">

<h1>Submit Answer Sheet</h1>

<div id="paperBox"
     class="paper">
Loading question paper...
</div>


<label>
<strong>Select Answer Photos</strong>
</label>

<input
    type="file"
    id="answerPhotos"
    accept="image/*"
    multiple
>


<div class="small">
Maximum 20 answer photos.
</div>


<button
    id="livePhotoButton"
    type="button"
    onclick="takeLivePhoto()">

    Take Live Photo (Optional)

</button>


<div id="liveStatus"
     class="status">

Live photo is optional. It is not uploaded to Drive.
</div>


<button
    id="submitButton"
    type="button"
    onclick="submitAnswers()">

    Submit Answer Sheet

</button>


<div id="status"
     class="status">
Please select your answer photos.
</div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


const params =
new URLSearchParams(
    window.location.search
);


const questionPaperId =
params.get(
    "questionPaperId"
);


const studentId =
localStorage.getItem("studentId") ||
localStorage.getItem("StudentID") ||
localStorage.getItem("studentID") ||
localStorage.getItem("loggedInStudentId") ||
localStorage.getItem("loggedInStudentID") ||
localStorage.getItem("currentStudentId");


let paperData = null;


/****************************************************
 * LOAD PAPER
 ****************************************************/

async function loadPaper(){

    if(!questionPaperId){

        showStatus(
            "Question Paper ID is missing.",
            true
        );

        return;
    }


    try{

        const response =
        await fetch(
            API_URL +
            "?action=getQuestionPapers"
        );


        const data =
        await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Unable to load papers."
            );
        }


        const papers =
        data.questionPapers || [];


        paperData =
        papers.find(function(p){

            return String(
                p.QuestionPaperID
            ) === String(
                questionPaperId
            );

        });


        if(!paperData){

            throw new Error(
                "Question paper not found."
            );
        }


        document.getElementById(
            "paperBox"
        ).innerHTML = `

            <strong>${escapeHtml(
                paperData.PaperName || ""
            )}</strong>

            <br><br>

            Question Paper ID:
            ${escapeHtml(
                paperData.QuestionPaperID || ""
            )}

            <br>

            Subject:
            ${escapeHtml(
                paperData.SubjectName || ""
            )}

            <br>

            Board:
            ${escapeHtml(
                paperData.Board || ""
            )}

            <br>

            Class:
            ${escapeHtml(
                paperData.Class || ""
            )}

        `;


    }catch(error){

        showStatus(
            error.message,
            true
        );
    }
}


/****************************************************
 * OPTIONAL LIVE PHOTO
 ****************************************************/

function takeLivePhoto(){

    window.location.href =
        "live-photo.html" +
        "?questionPaperId=" +
        encodeURIComponent(
            questionPaperId
        ) +
        "&type=submission";

}


/****************************************************
 * FILE COMPRESSION
 ****************************************************/

function compressImage(file){

    return new Promise(
        function(resolve,reject){

            const reader =
            new FileReader();


            reader.onload =
            function(event){

                const img =
                new Image();


                img.onload =
                function(){

                    const maxWidth =
                        1200;


                    let width =
                        img.width;

                    let height =
                        img.height;


                    if(width > maxWidth){

                        height =
                            Math.round(
                                height *
                                maxWidth /
                                width
                            );

                        width =
                            maxWidth;
                    }


                    const canvas =
                    document.createElement(
                        "canvas"
                    );


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                    canvas.getContext(
                        "2d"
                    );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            0.65
                        )
                    );

                };


                img.onerror =
                    reject;


                img.src =
                    event.target.result;

            };


            reader.onerror =
                reject;


            reader.readAsDataURL(file);

        }
    );
}


/****************************************************
 * SUBMIT ANSWERS
 ****************************************************/

async function submitAnswers(){

    const input =
    document.getElementById(
        "answerPhotos"
    );


    const files =
    Array.from(
        input.files || []
    );


    if(!studentId){

        showStatus(
            "Student login not found. Please login again.",
            true
        );

        return;
    }


    if(!questionPaperId){

        showStatus(
            "Question Paper ID is missing.",
            true
        );

        return;
    }


    if(files.length === 0){

        showStatus(
            "Please select at least one answer photo.",
            true
        );

        return;
    }


    if(files.length > 20){

        showStatus(
            "Maximum 20 answer photos are allowed.",
            true
        );

        return;
    }


    const button =
    document.getElementById(
        "submitButton"
    );


    button.disabled =
        true;

    button.innerText =
        "Uploading Answer Sheet...";


    showStatus(
        "Preparing answer photos. Please wait..."
    );


    try{

        const answerPhotos = [];


        for(
            let i = 0;
            i < files.length;
            i++
        ){

            showStatus(
                "Preparing photo " +
                (i + 1) +
                " of " +
                files.length +
                "..."
            );


            const compressed =
            await compressImage(
                files[i]
            );


            answerPhotos.push(
                compressed
            );
        }


        const submissionId =
            generateSubmissionId();


        showStatus(
            "Submitting answer sheet..."
        );


        const requestBody = {

            action:
                "submitAnswer",

            submissionId:
                submissionId,

            studentId:
                studentId,

            questionPaperId:
                questionPaperId,

            subjectId:
                paperData
                    ? (
                        paperData.SubjectID ||
                        ""
                    )
                    : "",

            /*
             * Live photo is optional.
             * Backend does NOT require it.
             */
            livePhotoCaptured:
                "optional",

            answerPhotos:
                answerPhotos
        };


        const response =
        await fetch(
            API_URL +
            "?action=submitAnswer",
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        requestBody
                    )
            }
        );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Submission failed."
            );
        }


        showStatus(
            "Answer sheet submitted successfully. Submission ID: " +
            data.submissionId,
            false,
            true
        );


        button.innerText =
            "Submitted Successfully";


        setTimeout(
            function(){

                window.location.href =
                    "student-dashboard.html";

            },
            1800
        );


    }catch(error){

        button.disabled =
            false;

        button.innerText =
            "Submit Answer Sheet";


        showStatus(
            "Submission failed. " +
            error.message,
            true
        );
    }
}


/****************************************************
 * SUBMISSION ID
 ****************************************************/

function generateSubmissionId(){

    const now =
        new Date();


    return "SUB" +
        now.getTime() +
        "_" +
        Math.floor(
            Math.random() *
            1000
        );
}


/****************************************************
 * STATUS
 ****************************************************/

function showStatus(
    message,
    error,
    success
){

    const box =
        document.getElementById(
            "status"
        );


    box.innerText =
        message;


    box.className =
        "status";


    if(error){

        box.classList.add(
            "error"
        );
    }


    if(success){

        box.classList.add(
            "success"
        );
    }
}


/****************************************************
 * HTML ESCAPE
 ****************************************************/

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/****************************************************
 * START
 ****************************************************/

loadPaper();

</script>

</body>
</html>
