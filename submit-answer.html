<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Exam - Submit Answer</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
}
.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}
.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}
input[type=file]{
    width:100%;
    padding:10px;
}
button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    margin-top:12px;
}
.success{
    background:#16a34a;
    color:white;
}
.danger{
    background:#dc2626;
    color:white;
}
.preview{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:15px;
}
.preview img{
    width:100%;
    border-radius:7px;
}
#submitButton{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>Submit Answer Paper</h2>

<p>
<b>Student ID:</b>
<span id="studentId"></span>
</p>

<p>
<b>Question Paper:</b>
<span id="paperName">Loading...</span>
</p>

<p>
<b>Subject:</b>
<span id="subjectName"></span>
</p>

<p>
<b>Live Photo:</b>
<span id="liveStatus">Not available</span>
</p>

</div>


<div class="card">

<h3>Upload Answer Paper</h3>

<p>
Upload maximum <b>20 photos</b> of your answer paper.
</p>

<input
    id="answerFiles"
    type="file"
    accept="image/*"
    multiple>

<div id="count"></div>

<div
    id="preview"
    class="preview">
</div>

<button
    id="submitButton"
    class="success"
    onclick="submitAnswers()">
    Submit Answer Paper
</button>

<button
    class="danger"
    onclick="window.location.href='question-papers.html'">
    Back
</button>

<div id="status"></div>

</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";

const studentId =
localStorage.getItem("studentId");

const questionPaperId =
new URLSearchParams(location.search)
.get("questionPaperId");

if(!studentId){
    window.location.href="login.html";
}

let paper = null;
let selectedFiles = [];


/************************************************
 * LOAD PAPER
 ************************************************/

async function loadPaper(){

    try{

        const result =
            await api(
                "getPublishedQuestionPapers"
            );

        paper =
            result.papers.find(
                x =>
                x.questionPaperId ===
                questionPaperId
            );

        if(!paper){

            setStatus(
                "Question paper is not available."
            );

            return;
        }

        document.getElementById("paperName")
            .textContent =
            paper.paperName;

        document.getElementById("subjectName")
            .textContent =
            paper.subjectCode +
            " - " +
            paper.subjectName;

        /*
         * Live photo is stored during the
         * question paper download process.
         *
         * We retrieve it from localStorage.
         */
        const key =
            "livePhoto_" +
            studentId +
            "_" +
            questionPaperId;

        const livePhotoUrl =
            localStorage.getItem(key);

        if(livePhotoUrl){

            document.getElementById("liveStatus")
                .textContent =
                "Verified";

        }else{

            document.getElementById("liveStatus")
                .textContent =
                "Please download the paper first.";

        }

    }catch(err){

        setStatus(err.message);
    }
}


/************************************************
 * FILE SELECTION
 ************************************************/

document.getElementById("answerFiles")
.addEventListener(
    "change",
    function(){

        const files =
            Array.from(this.files);

        if(files.length > 20){

            alert(
                "Maximum 20 photos are allowed."
            );

            this.value = "";

            return;
        }

        selectedFiles = files;

        document.getElementById("count")
            .textContent =
            files.length +
            " photo(s) selected.";

        showPreview();

        document.getElementById("submitButton")
            .style.display =
            files.length > 0
            ? "block"
            : "none";
    }
);


function showPreview(){

    const box =
        document.getElementById("preview");

    box.innerHTML = "";

    selectedFiles.forEach(file => {

        const img =
            document.createElement("img");

        img.src =
            URL.createObjectURL(file);

        box.appendChild(img);
    });
}


/************************************************
 * SUBMIT
 ************************************************/

async function submitAnswers(){

    if(selectedFiles.length < 1){

        alert(
            "Please select answer paper photos."
        );

        return;
    }

    if(selectedFiles.length > 20){

        alert(
            "Maximum 20 photos are allowed."
        );

        return;
    }

    const key =
        "livePhoto_" +
        studentId +
        "_" +
        questionPaperId;

    const livePhotoUrl =
        localStorage.getItem(key);

    if(!livePhotoUrl){

        alert(
            "Live photo verification is required."
        );

        window.location.href =
            "live-photo.html?questionPaperId=" +
            encodeURIComponent(questionPaperId);

        return;
    }

    setStatus(
        "Preparing answer photos..."
    );

    const photos = [];

    try{

        for(let i=0;i<selectedFiles.length;i++){

            setStatus(
                "Preparing photo " +
                (i+1) +
                " of " +
                selectedFiles.length +
                "..."
            );

            const compressed =
                await compressImage(
                    selectedFiles[i]
                );

            photos.push({
                base64:compressed,
                mimeType:"image/jpeg"
            });
        }

        setStatus(
            "Uploading answer paper. Please do not close this page..."
        );

        const result =
            await postData({

                action:"submitAnswer",

                studentId:
                studentId,

                questionPaperId:
                questionPaperId,

                livePhotoUrl:
                livePhotoUrl,

                answerPhotos:
                photos
            });

        setStatus(
            "Answer paper submitted successfully. Submission ID: " +
            result.submissionId
        );

        document.getElementById("submitButton")
            .style.display = "none";

        document.getElementById("answerFiles")
            .disabled = true;

    }catch(err){

        setStatus(
            "Submission failed: " +
            err.message
        );
    }
}


/************************************************
 * IMAGE COMPRESSION
 ************************************************/

function compressImage(file){

    return new Promise(
        (resolve,reject)=>{

            const reader =
                new FileReader();

            reader.onload =
                function(e){

                    const img =
                        new Image();

                    img.onload =
                        function(){

                            const maxWidth =
                                1400;

                            let width =
                                img.width;

                            let height =
                                img.height;

                            if(width > maxWidth){

                                height =
                                    Math.round(
                                        height *
                                        maxWidth /
                                        width
                                    );

                                width =
                                    maxWidth;
                            }

                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;

                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );

                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.65
                                )
                            );
                        };

                    img.onerror =
                        reject;

                    img.src =
                        e.target.result;
                };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);
        }
    );
}


/************************************************
 * API
 ************************************************/

function api(action, params={}){

    return new Promise(
        (resolve,reject)=>{

            const callback =
                "cb_" +
                Date.now() +
                "_" +
                Math.floor(
                    Math.random()*10000
                );

            const script =
                document.createElement(
                    "script"
                );

            window[callback] =
                function(data){

                    delete window[callback];

                    script.remove();

                    if(data.success){
                        resolve(data);
                    }else{
                        reject(
                            new Error(
                                data.message ||
                                "Error"
                            )
                        );
                    }
                };

            params.action =
                action;

            params.studentId =
                studentId;

            params.callback =
                callback;

            const query =
                Object.keys(params)
                .map(k =>
                    encodeURIComponent(k) +
                    "=" +
                    encodeURIComponent(
                        params[k]
                    )
                )
                .join("&");

            script.src =
                API + "?" + query;

            script.onerror =
                () =>
                reject(
                    new Error(
                        "API connection failed."
                    )
                );

            document.body.appendChild(
                script
            );
        }
    );
}


function postData(data){

    return fetch(
        API,
        {
            method:"POST",
            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },
            body:JSON.stringify(data)
        }
    )
    .then(r => r.json());
}


function setStatus(message){

    document.getElementById("status")
        .textContent = message;
}


document.getElementById("studentId")
    .textContent =
    studentId;

loadPaper();

</script>

</body>
</html>
