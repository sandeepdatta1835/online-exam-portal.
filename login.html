<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Login - Online Exam</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#f2f5f9;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

}

.login-box{

    background:white;

    width:90%;

    max-width:420px;

    padding:30px;

    border-radius:12px;

    box-shadow:
    0 4px 20px rgba(0,0,0,.12);

}

h1{

    text-align:center;

    color:#173b73;

    margin-bottom:5px;

}

.subtitle{

    text-align:center;

    color:#666;

    margin-bottom:25px;

}

label{

    display:block;

    font-weight:bold;

    margin-bottom:6px;

}

input{

    width:100%;

    padding:13px;

    margin-bottom:18px;

    border:1px solid #ccc;

    border-radius:6px;

    font-size:16px;

}

button{

    width:100%;

    padding:13px;

    background:#173b73;

    color:white;

    border:none;

    border-radius:6px;

    font-size:16px;

    cursor:pointer;

}

button:disabled{

    background:#999;

}

.message{

    margin-top:15px;

    padding:12px;

    border-radius:6px;

    display:none;

}

.error{

    background:#f8d7da;

    color:#842029;

}

.success{

    background:#d1e7dd;

    color:#0f5132;

}

.home{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#173b73;

    text-decoration:none;

}

</style>

</head>

<body>


<div class="login-box">

    <h1>Online Exam</h1>

    <div class="subtitle">
        Student Login
    </div>


    <label for="studentId">
        Student ID
    </label>

    <input
        type="text"
        id="studentId"
        placeholder="Enter Student ID"
        autocomplete="username"
    >


    <label for="password">
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        autocomplete="current-password"
    >


    <button
        id="loginButton"
        onclick="studentLogin()"
    >
        Login
    </button>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="index.html"
        class="home"
    >
        ← Back to Home
    </a>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.style.display = "block";

    box.className =
        "message " + type;

    box.innerHTML = text;

}


async function studentLogin(){

    const studentId =
        document
        .getElementById("studentId")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value
        .trim();


    if(!studentId){

        showMessage(
            "Please enter Student ID.",
            "error"
        );

        return;

    }


    if(!password){

        showMessage(
            "Please enter Password.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById("loginButton");

    button.disabled = true;

    button.innerText =
        "Connecting...";


    showMessage(
        "Checking Student ID and Password...",
        "success"
    );


    try{

        const url =
            new URL(API);


        url.searchParams.set(
            "action",
            "studentLogin"
        );


        url.searchParams.set(
            "studentId",
            studentId
        );


        url.searchParams.set(
            "password",
            password
        );


        const response =
            await fetch(
                url.toString(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Server returned HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        let result;


        try{

            result =
                JSON.parse(text);

        }
        catch(error){

            throw new Error(
                "Invalid response from server."
            );

        }


        if(result.success){

            localStorage.setItem(
                "studentId",
                studentId
            );


            localStorage.setItem(
                "studentLoggedIn",
                "true"
            );


            /*
              Save complete student information
              if returned by the API.
            */

            if(result.student){

                localStorage.setItem(
                    "studentData",
                    JSON.stringify(result.student)
                );

            }


            showMessage(
                "✅ Login successful. Opening dashboard...",
                "success"
            );


            setTimeout(function(){

                window.location.href =
                    "student-dashboard.html";

            },800);


        }
        else{

            showMessage(
                "❌ " +
                (
                    result.message ||
                    "Invalid Student ID or Password."
                ),
                "error"
            );

            button.disabled = false;

            button.innerText =
                "Login";

        }

    }
    catch(error){

        console.error(error);


        showMessage(
            "❌ Could not connect to server.<br><br>" +
            "Please check your internet connection and try again.<br><br>" +
            "<small>" +
            error.message +
            "</small>",
            "error"
        );


        button.disabled = false;

        button.innerText =
            "Login";

    }

}


/*
   Press Enter to Login
*/

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            studentLogin();

        }

    }
);

</script>

</body>

</html>
