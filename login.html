<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Login - Online Exam Portal</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
}

.header{
    background:#172554;
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:24px;
}

.login-container{
    max-width:420px;
    margin:50px auto;
    padding:15px;
}

.login-box{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.login-box h2{
    text-align:center;
    color:#172554;
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:22px;
    padding:13px;
    border:0;
    border-radius:6px;
    background:#172554;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    text-align:center;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:#172554;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
    <h1>🎓 Online Exam Portal</h1>
</div>

<div class="login-container">

    <div class="login-box">

        <h2>Student Login</h2>

        <form id="loginForm">

            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Enter Student ID"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>

        <div class="back">
            <a href="index.html">
                ← Back to Home
            </a>
        </div>

    </div>

</div>


<script>

/* =========================
   GOOGLE APPS SCRIPT
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


/* =========================
   MESSAGE
========================= */

function showMessage(message, success){

    const box =
        document.getElementById("message");

    box.textContent =
        message;

    box.className =
        "message " +
        (success ? "success" : "error");

    box.style.display =
        "block";
}


/* =========================
   STUDENT LOGIN
========================= */

function studentLogin(studentId,password){

    return new Promise(function(resolve){

        const callbackName =
            "loginCallback_" +
            Date.now();

        let script = null;
        let finished = false;


        function cleanup(){

            if(window[callbackName]){
                delete window[callbackName];
            }

            if(
                script &&
                script.parentNode
            ){
                script.parentNode.removeChild(script);
            }
        }


        window[callbackName] =
            function(result){

                if(finished){
                    return;
                }

                finished = true;

                cleanup();

                resolve(result);
            };


        const url =
            API_URL +
            "?action=studentLogin" +
            "&callback=" +
            encodeURIComponent(callbackName) +
            "&studentId=" +
            encodeURIComponent(studentId) +
            "&password=" +
            encodeURIComponent(password);


        script =
            document.createElement("script");

        script.src = url;
        script.async = true;


        script.onerror =
            function(){

                if(finished){
                    return;
                }

                finished = true;

                cleanup();

                resolve({
                    success:false,
                    message:
                    "Could not connect to server."
                });
            };


        document.body.appendChild(script);


        setTimeout(function(){

            if(finished){
                return;
            }

            finished = true;

            cleanup();

            resolve({
                success:false,
                message:
                "Connection timed out. Please try again."
            });

        },15000);

    });
}


/* =========================
   LOGIN FORM
========================= */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const button =
            document.getElementById(
                "loginButton"
            );


        const studentId =
            document
            .getElementById(
                "studentId"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "password"
            )
            .value;


        button.disabled = true;
        button.textContent = "Logging in...";


        showMessage(
            "Checking login...",
            true
        );


        try{

            const result =
                await studentLogin(
                    studentId,
                    password
                );


            if(result.success){

                /* Save student information */

                const data =
                    result.data || {};


                localStorage.setItem(
                    "studentId",
                    data.studentId || studentId
                );

                localStorage.setItem(
                    "studentName",
                    data.studentName || ""
                );

                localStorage.setItem(
                    "enrollment",
                    data.enrollment || ""
                );

                localStorage.setItem(
                    "mobile",
                    data.mobile || ""
                );

                localStorage.setItem(
                    "email",
                    data.email || ""
                );

                localStorage.setItem(
                    "board",
                    data.board || ""
                );

                localStorage.setItem(
                    "studentClass",
                    data.studentClass || ""
                );

                localStorage.setItem(
                    "studentSubjects",
                    JSON.stringify(
                        data.subjects || []
                    )
                );


                showMessage(
                    "Login successful. Opening dashboard...",
                    true
                );


                setTimeout(function(){

                    window.location.href =
                        "student-dashboard.html";

                },700);


            }else{

                showMessage(
                    result.message ||
                    "Invalid Student ID or Password.",
                    false
                );

            }


        }catch(error){

            showMessage(
                "Login error: " +
                error.message,
                false
            );

        }


        button.disabled = false;
        button.textContent = "Login";

    }
);

</script>

</body>
</html>
