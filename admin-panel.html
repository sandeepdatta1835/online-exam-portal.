<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Online Exam Portal</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#182848;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
    font-size:22px;
}

.header p{
    margin:5px 0 0;
    font-size:13px;
}

.logout{
    background:#e53935;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:6px;
}

.container{
    width:94%;
    max-width:1100px;
    margin:25px auto;
}

.card{
    background:white;
    padding:22px;
    margin-bottom:22px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    color:#182848;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    width:100%;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#182848;
}

.create-btn{
    background:#182848;
    color:white;
    border:0;
    padding:13px 20px;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.create-btn:disabled{
    background:#888;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    display:none;
}

.success{
    display:block;
    background:#dff5e3;
    color:#176b2b;
}

.error{
    display:block;
    background:#ffe1e1;
    color:#a00000;
}

.info{
    display:block;
    background:#e4efff;
    color:#164c91;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:750px;
    border-collapse:collapse;
}

th{
    background:#182848;
    color:white;
    padding:11px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #ddd;
}

.status{
    color:#176b2b;
    font-weight:bold;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .header{
        padding:15px;
    }

    .header h1{
        font-size:18px;
    }

    .container{
        width:95%;
    }

    .card{
        padding:17px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div>

        <h1>
            Online Exam Portal
        </h1>

        <p>
            Administrator Panel
        </p>

    </div>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</header>



<!-- MAIN -->

<div class="container">


<!-- CREATE STUDENT -->

<div class="card">

<h2>
Create Student Account
</h2>

<p>
Create a student account and save the
student information to Google Sheets.
</p>


<form id="studentForm">


<div class="form-grid">


<!-- NAME -->

<div class="form-group">

<label>
Student Name
</label>

<input
type="text"
id="studentName"
placeholder="Enter student name"
required>

</div>


<!-- STUDENT ID -->

<div class="form-group">

<label>
Student ID
</label>

<input
type="text"
id="studentId"
placeholder="Example: STU001"
required>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label>
Password
