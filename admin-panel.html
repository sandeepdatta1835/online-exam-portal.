<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Online Exam Portal</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#222;
}

.header{
    background:#173b7a;
    color:white;
    padding:18px 20px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:5px 0 0;
    font-size:14px;
    opacity:.9;
}

.logout-btn{
    background:#dc3545;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:25px auto;
    padding:0 15px;
}

/* Statistics */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    text-align:center;
}

.stat-card h2{
    margin:0;
    color:#173b7a;
    font-size:30px;
}

.stat-card p{
    margin:8px 0 0;
    color:#666;
}

/* Main cards */

.card{
    background:white;
    border-radius:10px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    color:#173b7a;
}

/* Form */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
}

.form-group input,
.form-group select{
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

.form-group input:focus,
.form-group select:focus{
    outline:none;
    border-color:#173b7a;
}

.full{
    grid-column:1 / -1;
}

.create-btn{
    background:#198754;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin-top:5px;
}
