<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Online Exam Portal</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#182848;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
    font-size:22px;
}

.header p{
    margin:5px 0 0;
    font-size:13px;
}

.logout{
    background:#e53935;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:6px;
}

.container{
    width:94%;
    max-width:1100px;
    margin:25px auto;
}

.card{
    background:white;
    padding:22px;
    margin-bottom:22px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    color:#182848;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    width:100%;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    font-size:14px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#182848;
}

.create-btn{
    background:#182848;
    color:white;
    border:0;
    padding:13px 20px;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.create-btn:disabled{
    background:#888;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    display:none;
}

.success{
    display:block;
    background:#dff5e3;
    color:#176b2b;
}

.error{
    display:block;
    background:#ffe1e1;
    color:#a00000;
}

.info{
    display:block;
    background:#e4efff;
    color:#164c91;
}

.table-box{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:750px;
    border-collapse:collapse;
}

th{
    background:#182848;
    color:white;
    padding:11px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #ddd;
}

.status{
    color:#176b2b;
    font-weight:bold;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .header{
        padding:15px;
    }

    .header h1{
        font-size:18px;
    }

    .container{
        width:95%;
    }

    .card{
        padding:17px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div>

        <h1>
            Online Exam Portal
        </h1>

        <p>
            Administrator Panel
        </p>

    </div>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</header>



<!-- MAIN -->

<div class="container">


<!-- CREATE STUDENT -->

<div class="card">

<h2>
Create Student Account
</h2>

<p>
Create a student account and save the
student information to Google Sheets.
</p>


<form id="studentForm">


<div class="form-grid">


<!-- NAME -->

<div class="form-group">

<label>
Student Name
</label>

<input
type="text"
id="studentName"
placeholder="Enter student name"
required>

</div>


<!-- STUDENT ID -->

<div class="form-group">

<label>
Student ID
</label>

<input
type="text"
id="studentId"
placeholder="Example: STU001"
required>

</div>


<!-- PASSWORD -->

<div class="form-group">

<label>
Password
</label>

<input
type="text"
id="studentPassword"
placeholder="Enter password"
required>

</div>


<!-- ENROLLMENT -->

<div class="form-group">

<label>
Enrollment No.
</label>

<input
type="text"
id="enrollment"
placeholder="Enter enrollment number">

</div>


<!-- MOBILE -->

<div class="form-group">

<label>
Mobile Number
</label>

<input
type="text"
id="mobile"
placeholder="Enter mobile number">

</div>


<!-- EMAIL -->

<div class="form-group">

<label>
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter email">

</div>


<!-- BOARD -->

<div class="form-group">

<label>
Board
</label>

<select id="board">

<option value="">
Select Board
</option>

<option value="NIOS">
NIOS
</option>

<option value="CBSE">
CBSE
</option>

<option value="ICSE">
ICSE
</option>

<option value="Maharashtra Board">
Maharashtra Board
</option>

<option value="Other">
Other
</option>

</select>

</div>


<!-- CLASS -->

<div class="form-group">

<label>
Class
</label>

<input
type="text"
id="studentClass"
placeholder="Example: 10">

</div>


<!-- BUTTON -->

<div class="form-group full">

<button
type="submit"
class="create-btn"
id="createButton">

Create Student Account

</button>

</div>


</div>

</form>


<div
id="message"
class="message">
</div>


</div>



<!-- STUDENT LIST -->

<div class="card">

<h2>
Student Accounts
</h2>

<div class="table-box">

<table>

<thead>

<tr>

<th>
Student Name
</th>

<th>
Student ID
</th>

<th>
Enrollment
</th>

<th>
Mobile
</th>

<th>
Email
</th>

<th>
Board
</th>

<th>
Class
</th>

<th>
Status
</th>

</tr>

</thead>


<tbody id="studentTable">

</tbody>


</table>

</div>

</div>


</div>



<script>


/*
========================================
ADMIN LOGIN CHECK
========================================
*/

if(
    sessionStorage.getItem(
        "adminLoggedIn"
    ) !== "true"
){

    window.location.href =
        "admin-login.html";

}



/*
========================================
GOOGLE APPS SCRIPT URL
========================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbwZK14mHGJmBYAy9oOErqiQa7F0YI2KsWc3ZO9_G0KpOQAI0IpjnAra4c1toEzXP-KK9w/exec";



/*
========================================
GET ELEMENTS
========================================
*/

const form =
document.getElementById(
    "studentForm"
);

const button =
document.getElementById(
    "createButton"
);

const message =
document.getElementById(
    "message"
);

const table =
document.getElementById(
    "studentTable"
);



/*
========================================
MESSAGE
========================================
*/

function showMessage(
    text,
    type
){

    message.innerText =
        text;

    message.className =
        "message " + type;

}



/*
========================================
CREATE STUDENT
========================================
*/

form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        const studentName =
        document.getElementById(
            "studentName"
        ).value.trim();


        const studentId =
        document.getElementById(
            "studentId"
        ).value.trim();


        const password =
        document.getElementById(
            "studentPassword"
        ).value.trim();


        const enrollment =
        document.getElementById(
            "enrollment"
        ).value.trim();


        const mobile =
        document.getElementById(
            "mobile"
        ).value.trim();


        const email =
        document.getElementById(
            "email"
        ).value.trim();


        const board =
        document.getElementById(
            "board"
        ).value.trim();


        const studentClass =
        document.getElementById(
            "studentClass"
        ).value.trim();



        /*
        REQUIRED FIELDS
        */

        if(
            studentName === "" ||
            studentId === "" ||
            password === ""
        ){

            showMessage(
                "Please enter Student Name, Student ID and Password.",
                "error"
            );

            return;

        }



        /*
        DISABLE BUTTON
        */

        button.disabled =
            true;

        button.innerText =
            "Saving...";


        showMessage(
            "Sending student information to Google Sheets...",
            "info"
        );



        /*
        DATA
        */

        const data = {

            action:
                "createStudent",

            studentId:
                studentId,

            studentName:
                studentName,

            password:
                password,

            enrollment:
                enrollment,

            mobile:
                mobile,

            email:
                email,

            board:
                board,

            studentClass:
                studentClass

        };



        /*
        =================================
        SEND REQUEST
        =================================
        */

        fetch(
            API_URL,
            {

                method:"POST",

                headers:{
                    "Content-Type":
                    "text/plain;charset=utf-8"
                },

                body:
                JSON.stringify(data)

            }
        )

        .then(
            function(response){

                return response.json();

            }
        )

        .then(
            function(result){

                console.log(
                    "API Response:",
                    result
                );


                if(
                    result.success === true
                ){

                    showMessage(
                        "Student created successfully in Google Sheets.",
                        "success"
                    );


                    addStudent(
                        studentName,
                        studentId,
                        enrollment,
                        mobile,
                        email,
                        board,
                        studentClass
                    );


                    form.reset();

                }

                else{

                    showMessage(
                        result.message ||
                        "Student was not created.",
                        "error"
                    );

                }


                button.disabled =
                    false;

                button.innerText =
                    "Create Student Account";

            }
        )

        .catch(
            function(error){

                console.error(
                    "ERROR:",
                    error
                );


                showMessage(
                    "Connection error: " +
                    error.message,
                    "error"
                );


                button.disabled =
                    false;

                button.innerText =
                    "Create Student Account";

            }
        );

    }
);



/*
========================================
ADD STUDENT TO TABLE
========================================
*/

function addStudent(
    name,
    id,
    enrollment,
    mobile,
    email,
    board,
    studentClass
){

    const row =
    document.createElement(
        "tr"
    );


    row.innerHTML =

    "<td>" +
    escapeHTML(name) +
    "</td>" +

    "<td>" +
    escapeHTML(id) +
    "</td>" +

    "<td>" +
    escapeHTML(enrollment) +
    "</td>" +

    "<td>" +
    escapeHTML(mobile) +
    "</td>" +

    "<td>" +
    escapeHTML(email) +
    "</td>" +

    "<td>" +
    escapeHTML(board) +
    "</td>" +

    "<td>" +
    escapeHTML(studentClass) +
    "</td>" +

    "<td class='status'>" +
    "Active" +
    "</td>";


    table.appendChild(
        row
    );

}



/*
========================================
HTML SECURITY
========================================
*/

function escapeHTML(
    value
){

    return String(value)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}



/*
========================================
LOGOUT
========================================
*/

function logout(){

    sessionStorage.removeItem(
        "adminLoggedIn"
    );

    sessionStorage.removeItem(
        "adminId"
    );

    window.location.href =
        "admin-login.html";

}

</script>


</body>

</html>
