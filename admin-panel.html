<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Online Exam Portal</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.header{
    background:#173b7a;
    color:white;
    padding:20px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logout{
    background:#dc3545;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:6px;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    color:#173b7a;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    font-weight:bold;
    margin-bottom:6px;
    display:block;
}

input,select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    cursor:pointer;
}

.create{
    background:#198754;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:6px;
    font-weight:bold;
}

.search{
    width:100%;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#173b7a;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.table-wrap{
    overflow-x:auto;
}

.copy{
    background:#0d6efd;
    color:white;
    border:0;
    padding:7px;
    border-radius:5px;
}

.delete{
    background:#dc3545;
    color:white;
    border:0;
    padding:7px;
    border-radius:5px;
}

.message{
    margin-top:15px;
    padding:12px;
    display:none;
    border-radius:6px;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

@media(max-width:700px){

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="header">

    <div class="header-inner">

        <div>
            <h1>🔐 Admin Panel</h1>
            <div>Online Exam Portal</div>
        </div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </div>

</div>


<div class="container">

    <div class="card">

        <h2>Admin Dashboard</h2>

        <p>
            Welcome, Administrator.
        </p>

        <p>
            Total Students:
            <strong id="studentCount">0</strong>
        </p>

    </div>


    <div class="card">

        <h2>➕ Create New Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <div>
                    <label>Student Name *</label>
                    <input
                        id="studentName"
                        required
                        placeholder="Student name">
                </div>

                <div>
                    <label>Student ID *</label>
                    <input
                        id="studentId"
                        required
                        placeholder="STU001">
                </div>

                <div>
                    <label>Password *</label>
                    <input
                        id="studentPassword"
                        required
                        placeholder="Student@123">
                </div>

                <div>
                    <label>Enrollment Number</label>
                    <input
                        id="enrollment"
                        placeholder="Enrollment number">
                </div>

                <div>
                    <label>Mobile Number</label>
                    <input
                        id="mobile"
                        placeholder="Mobile number">
                </div>

                <div>
                    <label>Email</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="Email">
                </div>

                <div>
                    <label>Course / Board</label>

                    <select id="course">

                        <option value="">
                            Select Board
                        </option>

                        <option>NIOS</option>
                        <option>CBSE</option>
                        <option>ICSE</option>
                        <option>Maharashtra Board</option>
                        <option>Other</option>

                    </select>
                </div>

                <div>
                    <label>Class</label>

                    <select id="studentClass">

                        <option value="">
                            Select Class
                        </option>

                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>Senior Secondary</option>

                    </select>
                </div>

            </div>

            <br>

            <button
                type="submit"
                class="create">
                Create Student Account
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>


    <div class="card">

        <h2>👨‍🎓 Student Accounts</h2>

        <input
            id="search"
            class="search"
            placeholder="Search student..."
            oninput="showStudents()">

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Student ID</th>
                        <th>Password</th>
                        <th>Enrollment</th>
                        <th>Mobile</th>
                        <th>Course</th>
                        <th>Class</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="studentTable"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

/*
========================================
ADMIN LOGIN CHECK
========================================
*/

if(
    sessionStorage.getItem("adminLoggedIn")
    !== "true"
){

    window.location.href =
        "admin-login.html";

}


/*
========================================
STUDENT FUNCTIONS
========================================
*/

function getStudents(){

    return JSON.parse(
        localStorage.getItem("students")
        || "[]"
    );

}


function saveStudents(students){

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

}


/*
========================================
CREATE STUDENT
========================================
*/

document
.getElementById("studentForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    const student = {

        name:
            document
            .getElementById("studentName")
            .value.trim(),

        studentId:
            document
            .getElementById("studentId")
            .value.trim(),

        password:
            document
            .getElementById("studentPassword")
            .value.trim(),

        enrollment:
            document
            .getElementById("enrollment")
            .value.trim(),

        mobile:
            document
            .getElementById("mobile")
            .value.trim(),

        email:
            document
            .getElementById("email")
            .value.trim(),

        course:
            document
            .getElementById("course")
            .value,

        studentClass:
            document
            .getElementById("studentClass")
            .value,

        createdDate:
            new Date().toLocaleString()

    };


    let students = getStudents();


    const exists =
        students.some(function(s){

            return s.studentId.toLowerCase()
                === student.studentId.toLowerCase();

        });


    if(exists){

        showMessage(
            "Student ID already exists.",
            "error"
        );

        return;

    }


    students.push(student);

    saveStudents(students);

    document
    .getElementById("studentForm")
    .reset();

    showStudents();

    showMessage(
        "Student account created successfully.",
        "success"
    );

});


/*
========================================
DISPLAY STUDENTS
========================================
*/

function showStudents(){

    const table =
        document.getElementById(
            "studentTable"
        );

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();

    const students = getStudents();


    const filtered =
        students.filter(function(s){

            return (
                s.name +
                " " +
                s.studentId +
                " " +
                s.enrollment +
                " " +
                s.mobile
            )
            .toLowerCase()
            .includes(search);

        });


    table.innerHTML = "";


    if(filtered.length === 0){

        table.innerHTML =
        `<tr>
            <td colspan="8"
                style="text-align:center">
                No students found.
            </td>
        </tr>`;

    }


    filtered.forEach(function(s){

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>${safe(s.name)}</td>

            <td>${safe(s.studentId)}</td>

            <td>${safe(s.password)}</td>

            <td>${safe(s.enrollment)}</td>

            <td>${safe(s.mobile)}</td>

            <td>${safe(s.course)}</td>

            <td>${safe(s.studentClass)}</td>

            <td>

                <button
                    class="copy"
                    onclick="copyStudent('${jsSafe(s.studentId)}')">
                    Copy
                </button>

                <button
                    class="delete"
                    onclick="deleteStudent('${jsSafe(s.studentId)}')">
                    Delete
                </button>

            </td>

        `;


        table.appendChild(row);

    });


    document
    .getElementById("studentCount")
    .textContent = students.length;

}


/*
========================================
COPY
========================================
*/

function copyStudent(id){

    const student =
        getStudents().find(function(s){

            return s.studentId === id;

        });


    if(!student){

        return;

    }


    const text =
        "Student Login Details\n\n" +
        "Student ID: " +
        student.studentId +
        "\nPassword: " +
        student.password;


    navigator.clipboard
    .writeText(text)
    .then(function(){

        alert(
            "Student login details copied."
        );

    })
    .catch(function(){

        alert(text);

    });

}


/*
========================================
DELETE
========================================
*/

function deleteStudent(id){

    if(
        !confirm(
            "Delete this student account?"
        )
    ){

        return;

    }


    const students =
        getStudents().filter(function(s){

            return s.studentId !== id;

        });


    saveStudents(students);

    showStudents();

}


/*
========================================
MESSAGE
========================================
*/

function showMessage(text,type){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display = "block";


    setTimeout(function(){

        box.style.display = "none";

    },4000);

}


/*
========================================
SECURITY HELPERS
========================================
*/

function safe(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function jsSafe(value){

    return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/*
========================================
LOGOUT
========================================
*/

function logout(){

    sessionStorage.removeItem(
        "adminLoggedIn"
    );

    sessionStorage.removeItem(
        "adminId"
    );

    window.location.href =
        "admin-login.html";

}


/*
========================================
START
========================================
*/

showStudents();

</script>

</body>
    </html>
