<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel | Online Exam Portal</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
}

.header{
    background:#173b7a;
    color:white;
    padding:20px;
}

.header-inner{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logout{
    background:#dc3545;
    color:white;
    border:0;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    color:#173b7a;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

label{
    font-weight:bold;
    margin-bottom:6px;
    display:block;
}

input,
select{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    cursor:pointer;
}

.create{
    background:#198754;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:6px;
    font-weight:bold;
}

.search{
    width:100%;
    margin-bottom:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#173b7a;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

.table-wrap{
    overflow-x:auto;
}

.copy{
    background:#0d6efd;
    color:white;
    border:0;
    padding:7px;
    border-radius:5px;
}

.inactive{
    color:#dc3545;
    font-weight:bold;
}

.active{
    color:#198754;
    font-weight:bold;
}

.message{
    margin-top:15px;
    padding:12px;
    display:none;
    border-radius:6px;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

.info{
    background:#cff4fc;
    color:#055160;
}

@media(max-width:700px){

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<div class="header">

    <div class="header-inner">

        <div>

            <h1>🔐 Admin Panel</h1>

            <div>
                Online Exam Portal
            </div>

        </div>

        <button
            class="logout"
            onclick="logout()">

            Logout

        </button>

    </div>

</div>



<div class="container">


<!-- DASHBOARD -->

<div class="card">

    <h2>Admin Dashboard</h2>

    <p>
        Welcome, Administrator.
    </p>

    <p>
        Total Students:
        <strong id="studentCount">0</strong>
    </p>

</div>



<!-- CREATE STUDENT -->

<div class="card">

    <h2>➕ Create New Student</h2>

    <form id="studentForm">


        <div class="form-grid">


            <div>

                <label>
                    Student Name *
                </label>

                <input
                    id="studentName"
                    required
                    placeholder="Student name">

            </div>


            <div>

                <label>
                    Student ID *
                </label>

                <input
                    id="studentId"
                    required
                    placeholder="STU001">

            </div>


            <div>

                <label>
                    Password *
                </label>

                <input
                    id="studentPassword"
                    required
                    placeholder="Student@123">

            </div>


            <div>

                <label>
                    Enrollment Number
                </label>

                <input
                    id="enrollment"
                    placeholder="Enrollment number">

            </div>


            <div>

                <label>
                    Mobile Number
                </label>

                <input
                    id="mobile"
                    placeholder="Mobile number">

            </div>


            <div>

                <label>
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Email">

            </div>


            <div>

                <label>
                    Course / Board
                </label>

                <select id="course">

                    <option value="">
                        Select Board
                    </option>

                    <option>NIOS</option>
                    <option>CBSE</option>
                    <option>ICSE</option>
                    <option>Maharashtra Board</option>
                    <option>Other</option>

                </select>

            </div>


            <div>

                <label>
                    Class
                </label>

                <select id="studentClass">

                    <option value="">
                        Select Class
                    </option>

                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>
                    <option>11</option>
                    <option>12</option>
                    <option>Senior Secondary</option>

                </select>

            </div>


        </div>


        <br>


        <button
            type="submit"
            class="create">

            Create Student Account

        </button>


    </form>


    <div
        id="message"
        class="message">
    </div>

</div>



<!-- STUDENT ACCOUNTS -->

<div class="card">

    <h2>👨‍🎓 Student Accounts</h2>


    <p class="info"
       style="display:block">

        Student records are now being prepared for the
        Google Sheets database.

    </p>


    <input
        id="search"
        class="search"
        placeholder="Search student..."
        oninput="showStudents()">


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Student ID</th>

                    <th>Enrollment</th>

                    <th>Mobile</th>

                    <th>Board</th>

                    <th>Class</th>

                    <th>Status</th>

                </tr>

            </thead>


            <tbody id="studentTable">
            </tbody>

        </table>

    </div>

</div>


</div>



<script>


/*
========================================
ADMIN LOGIN CHECK
========================================
*/

if(
    sessionStorage.getItem("adminLoggedIn")
    !== "true"
){

    window.location.href =
        "admin-login.html";

}



/*
========================================
GOOGLE APPS SCRIPT WEB APP
========================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbwZK14mHGJmBYAy9oOErqiQa7F0YI2KsWc3ZO9_G0KpOQAI0IpjnAra4c1toEzXP-KK9w/exec";



/*
========================================
TEMPORARY LOCAL DISPLAY
========================================

This keeps the current browser display working.

The real student record is sent to
Google Sheets.
========================================
*/

function getStudents(){

    return JSON.parse(
        localStorage.getItem("students")
        || "[]"
    );

}


function saveStudents(students){

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

}



/*
========================================
CREATE STUDENT
========================================
*/

document
.getElementById("studentForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const student = {

            name:
                document
                .getElementById("studentName")
                .value.trim(),

            studentId:
                document
                .getElementById("studentId")
                .value.trim(),

            password:
                document
                .getElementById("studentPassword")
                .value.trim(),

            enrollment:
                document
                .getElementById("enrollment")
                .value.trim(),

            mobile:
                document
                .getElementById("mobile")
                .value.trim(),

            email:
                document
                .getElementById("email")
                .value.trim(),

            board:
                document
                .getElementById("course")
                .value,

            studentClass:
                document
                .getElementById("studentClass")
                .value

        };


        if(
            !student.name ||
            !student.studentId ||
            !student.password
        ){

            showMessage(
                "Please enter Student Name, Student ID and Password.",
                "error"
            );

            return;

        }


        /*
        DISABLE BUTTON
        */

        const button =
            document
            .querySelector(".create");


        button.disabled = true;

        button.textContent =
            "Creating...";


        /*
        SEND TO GOOGLE SHEETS
        */

        try{

            const response =
                await fetch(
                    API_URL,
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                            "text/plain;charset=utf-8"
                        },

                        body:
                        JSON.stringify({

                            action:
                            "createStudent",

                            studentId:
                            student.studentId,

                            studentName:
                            student.name,

                            password:
                            student.password,

                            enrollment:
                            student.enrollment,

                            mobile:
                            student.mobile,

                            email:
                            student.email,

                            board:
                            student.board,

                            studentClass:
                            student.studentClass

                        })

                    }
                );


            const result =
                await response.json();


            if(!result.success){

                showMessage(
                    result.message ||
                    "Unable to create student.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Create Student Account";

                return;

            }


            /*
            ALSO KEEP LOCAL DISPLAY
            */

            let students =
                getStudents();


            students.push({

                name:
                student.name,

                studentId:
                student.studentId,

                password:
                student.password,

                enrollment:
                student.enrollment,

                mobile:
                student.mobile,

                email:
                student.email,

                course:
                student.board,

                studentClass:
                student.studentClass,

                status:
                "Active"

            });


            saveStudents(students);


            /*
            CLEAR FORM
            */

            document
            .getElementById("studentForm")
            .reset();


            showStudents();


            showMessage(
                "Student created successfully in Google Sheets.",
                "success"
            );


        }

        catch(error){

            console.error(error);


            showMessage(
                "Connection error. Student was not created.",
                "error"
            );

        }


        button.disabled = false;

        button.textContent =
            "Create Student Account";

    }
);



/*
========================================
DISPLAY STUDENTS
========================================
*/

function showStudents(){

    const table =
        document.getElementById(
            "studentTable"
        );


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase();


    const students =
        getStudents();


    const filtered =
        students.filter(
            function(s){

                return (

                    String(s.name || "")
                    + " " +

                    String(s.studentId || "")
                    + " " +

                    String(s.enrollment || "")
                    + " " +

                    String(s.mobile || "")

                )
                .toLowerCase()
                .includes(search);

            }
        );


    table.innerHTML = "";


    if(filtered.length === 0){

        table.innerHTML =
        `
        <tr>

            <td
                colspan="7"
                style="text-align:center">

                No students found.

            </td>

        </tr>
        `;

    }


    filtered.forEach(
        function(s){

            const row =
                document.createElement("tr");


            const status =
                s.status || "Active";


            row.innerHTML = `

                <td>
                    ${safe(s.name)}
