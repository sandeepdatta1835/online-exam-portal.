<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | Online Learning & Examination Portal</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #222;
        }


        /* ================= HEADER ================= */

        header {
            background: #102a43;
            color: white;
            padding: 14px 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }


        .header-container {
            max-width: 1250px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            font-size: 19px;
            font-weight: bold;
        }


        .admin-name {
            font-size: 14px;
        }


        .logout-btn {
            background: #d32f2f;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 9px 14px;

            cursor: pointer;
            font-weight: bold;

            margin-left: 10px;
        }


        .logout-btn:hover {
            background: #b71c1c;
        }


        /* ================= LAYOUT ================= */

        .page-container {
            max-width: 1250px;
            margin: auto;

            padding: 25px 15px 50px;
        }


        /* ================= WELCOME ================= */

        .welcome-box {
            background: white;

            padding: 24px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.07);

            margin-bottom: 25px;
        }


        .welcome-box h1 {
            color: #102a43;
            font-size: 27px;
            margin-bottom: 7px;
        }


        .welcome-box p {
            color: #666;
            font-size: 14px;
        }


        /* ================= STAT CARDS ================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 28px;
        }


        .stat-card {
            background: white;

            padding: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.07);
        }


        .stat-icon {
            font-size: 27px;
            margin-bottom: 10px;
        }


        .stat-card h3 {
            font-size: 27px;
            color: #102a43;

            margin-bottom: 5px;
        }


        .stat-card p {
            color: #777;
            font-size: 13px;
        }


        /* ================= SECTION ================= */

        .section-title {
            font-size: 21px;

            color: #102a43;

            margin-bottom: 15px;
        }


        /* ================= ADMIN GRID ================= */

        .admin-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }


        .admin-card {
            background: white;

            border-radius: 12px;

            padding: 23px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.07);

            transition: 0.2s;
        }


        .admin-card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 7px 20px rgba(0, 0, 0, 0.11);
        }


        .admin-card-icon {
            font-size: 32px;

            margin-bottom: 12px;
        }


        .admin-card h3 {
            color: #102a43;

            margin-bottom: 8px;

            font-size: 18px;
        }


        .admin-card p {
            color: #666;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 16px;
        }


        .card-btn {
            display: inline-block;

            background: #102a43;

            color: white;

            text-decoration: none;

            border: none;

            border-radius: 7px;

            padding: 10px 15px;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;
        }


        .card-btn:hover {
            background: #0d47a1;
        }
