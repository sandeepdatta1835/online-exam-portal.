<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Online Exam - My Results</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#1d4ed8;
    color:white;
    padding:20px;
}

.container{
    width:94%;
    max-width:1000px;
    margin:20px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,
td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#eef2ff;
}

.grade{
    font-weight:bold;
    color:#1d4ed8;
}

button{
    background:#1d4ed8;
    color:white;
    border:0;
    padding:11px 17px;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<div class="container">
<h1>Online Exam</h1>
<p>My Results</p>
</div>
</header>

<div class="container">

<div class="card">

<h2>Student Result</h2>

<p>
<strong>Student ID:</strong>
<span id="studentId"></span>
</p>

<div id="results">
Loading results...
</div>

<br>

<button onclick="
location.href='student-dashboard.html'
">
Back to Dashboard
</button>

</div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbzwMrFz4dBr4h_fp6zFT0mCkXSEw0_cqKgZxWBppnUWNTRoxBa9ee4B7Ljx30n9FCiOiA/exec";


const studentId =
    localStorage.getItem(
        "studentId"
    );


if(!studentId){

    location.href =
        "login.html";
}


document.getElementById(
    "studentId"
).textContent =
    studentId;


function api(action,params={}){

    return new Promise(function(resolve,reject){

        const callback =
            "cb_" +
            Date.now() +
            Math.floor(Math.random()*10000);

        const script =
            document.createElement("script");

        const query =
            new URLSearchParams();

        query.append(
            "action",
            action
        );

        query.append(
            "callback",
            callback
        );

        Object.keys(params).forEach(function(key){

            query.append(
                key,
                params[key]
            );

        });

        window[callback] =
            function(data){

                delete window[callback];

                script.remove();

                resolve(data);
            };

        script.onerror =
            function(){

                delete window[callback];

                script.remove();

                reject(
                    new Error(
                        "API connection failed"
                    )
                );
            };

        script.src =
            API + "?" + query.toString();

        document.body.appendChild(
            script
        );
    });
}


async function loadResults(){

    const box =
        document.getElementById(
            "results"
        );

    try{

        const result =
            await api(
                "getResults",
                {
                    studentId:
                        studentId
                }
            );

        if(!result.success){

            box.innerHTML =
                "<p>" +
                escapeHtml(result.message) +
                "</p>";

            return;
        }

        const results =
            result.data || [];

        if(results.length === 0){

            box.innerHTML =
                "<p>No published results are available.</p>";

            return;
        }

        let html =
            "<table>" +
            "<tr>" +
            "<th>Exam</th>" +
            "<th>Subject</th>" +
            "<th>Total Marks</th>" +
            "<th>Marks Obtained</th>" +
            "<th>Percentage</th>" +
            "<th>Grade</th>" +
            "<th>Remarks</th>" +
            "</tr>";

        results.forEach(function(item){

            html += `
                <tr>
                    <td>
                        ${escapeHtml(item.examName)}
                    </td>

                    <td>
                        ${escapeHtml(item.subjectId)}
                    </td>

                    <td>
                        ${escapeHtml(item.totalMarks)}
                    </td>

                    <td>
                        ${escapeHtml(item.marksObtained)}
                    </td>

                    <td>
                        ${escapeHtml(item.percentage)}%
                    </td>

                    <td class="grade">
                        ${escapeHtml(item.grade)}
                    </td>

                    <td>
                        ${escapeHtml(item.remarks)}
                    </td>
                </tr>
            `;
        });

        html += "</table>";

        box.innerHTML =
            html;

    }catch(error){

        box.innerHTML =
            "<p>" +
            escapeHtml(error.message) +
            "</p>";
    }
}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


loadResults();

</script>

</body>
</html>
