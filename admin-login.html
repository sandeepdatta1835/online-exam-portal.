<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Online Exam Portal</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    margin:20px;
}

.logo{
    text-align:center;
    font-size:45px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#173b7a;
    margin:0 0 8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    margin-bottom:18px;
}

input:focus{
    outline:none;
    border-color:#173b7a;
}

.login-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:6px;
    background:#173b7a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.login-btn:hover{
    background:#0f2b5d;
}

.error{
    display:none;
    background:#f8d7da;
    color:#842029;
    padding:12px;
    border-radius:6px;
    margin-bottom:15px;
    text-align:center;
}

.home{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#173b7a;
    text-decoration:none;
}

.demo{
    margin-top:20px;
    padding:12px;
    background:#fff3cd;
    color:#664d03;
    border-radius:6px;
    font-size:14px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🔐</div>

    <h1>Admin Login</h1>

    <div class="subtitle">
        Online Exam Portal
    </div>

    <div id="errorMessage" class="error">
        Invalid Admin ID or Password.
    </div>

    <form id="adminLoginForm">

        <label for="adminId">
            Admin ID
        </label>

        <input
            type="text"
            id="adminId"
            placeholder="Enter Admin ID"
            autocomplete="username"
            required
        >

        <label for="adminPassword">
            Password
        </label>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter Password"
            autocomplete="current-password"
            required
        >

        <button
            type="submit"
            class="login-btn"
        >
            Login to Admin Panel
        </button>

    </form>

    <div class="demo">
        <strong>Testing Login</strong><br>
        Admin ID: <strong>admin</strong><br>
        Password: <strong>Admin@123</strong>
    </div>

    <a href="index.html" class="home">
        ← Back to Home
    </a>

</div>


<script>

document
.getElementById("adminLoginForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    const adminId =
        document.getElementById("adminId")
        .value
        .trim();

    const adminPassword =
        document.getElementById("adminPassword")
        .value;

    const errorMessage =
        document.getElementById("errorMessage");


    if(
        adminId === "admin" &&
        adminPassword === "Admin@123"
    ){

        /*
          Save admin login status
        */

        sessionStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        sessionStorage.setItem(
            "adminId",
            adminId
        );


        /*
          Open Admin Panel
        */

        window.location.href =
            "admin-panel.html";

    }else{

        errorMessage.style.display =
            "block";

    }

});

</script>

</body>
    </html>
